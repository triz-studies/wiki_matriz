  <text x="360" y="149" text-anchor="middle" fill="#cc7777" font-size="16" font-weight="bold">-</text>
  <text x="654" y="149" text-anchor="middle" fill="#cc7777" font-size="16" font-weight="bold">-</text>
  <text x="801" y="149" text-anchor="middle" fill="#88cc88" font-size="16" font-weight="bold">+</text>
  <text x="949" y="149" text-anchor="middle" fill="#88cc88" font-size="16" font-weight="bold">+</text>

  <!-- Row 4 (Comp 4): - | - | - | grey | + | + -->
  <text x="214" y="188" text-anchor="middle" fill="#cc7777" font-size="16" font-weight="bold">-</text>
  <text x="360" y="188" text-anchor="middle" fill="#cc7777" font-size="16" font-weight="bold">-</text>
  <text x="507" y="188" text-anchor="middle" fill="#cc7777" font-size="16" font-weight="bold">-</text>
