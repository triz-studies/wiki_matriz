  <line x1="0" y1="163" x2="1024" y2="163" stroke="#444" stroke-width="0.8"/>
  <line x1="0" y1="202" x2="1024" y2="202" stroke="#444" stroke-width="0.8"/>
  <line x1="0" y1="241" x2="1024" y2="241" stroke="#444" stroke-width="0.8"/>

  <!-- Outer border -->
  <rect x="0" y="0" width="1024" height="284" fill="none" stroke="#666" stroke-width="1.2"/>

  <!-- ── COLUMN HEADERS ── -->
  <g text-anchor="middle" font-weight="bold" fill="#ddd" font-size="11">
    <text x="214" y="22">Thành phần 1</text>
    <text x="214" y="36">(Component 1)</text>
    <text x="360" y="22">Thành phần 2</text>
    <text x="360" y="36">(Component 2)</text>
    <text x="507" y="22">Thành phần 3</text>
    <text x="507" y="36">(Component 3)</text>
    <text x="654" y="22">Thành phần 4</text>
    <text x="654" y="36">(Component 4)</text>
    <text x="801" y="22">Thành phần 5</text>
    <text x="801" y="36">(Component 5)</text>
    <text x="949" y="22">Thành phần 6</text>
    <text x="949" y="36">(Component 6)</text>
  </g>

  <!-- ── ROW LABELS ── -->
  <g text-anchor="middle" font-weight="bold" fill="#ddd" font-size="11">
