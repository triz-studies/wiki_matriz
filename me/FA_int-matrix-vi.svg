<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 284" font-family="Arial, sans-serif" font-size="12">

  <!-- Background -->
  <rect width="1024" height="284" fill="#2a2a2a"/>

  <!-- Header row bg -->
  <rect x="0" y="0" width="1024" height="46" fill="#1e1e1e"/>

  <!-- Diagonal grey cells -->
  <rect x="140" y="46"  width="147" height="39" fill="#555555"/>
  <rect x="287" y="85"  width="147" height="39" fill="#555555"/>
  <rect x="434" y="124" width="147" height="39" fill="#555555"/>
  <rect x="581" y="163" width="147" height="39" fill="#555555"/>
  <rect x="728" y="202" width="147" height="39" fill="#555555"/>
  <rect x="875" y="241" width="149" height="43" fill="#555555"/>

  <!-- Grid lines vertical -->
  <g stroke="#444" stroke-width="0.8">
    <line x1="140" y1="0"   x2="140" y2="284"/>
    <line x1="287" y1="0"   x2="287" y2="284"/>
    <line x1="434" y1="0"   x2="434" y2="284"/>
    <line x1="581" y1="0"   x2="581" y2="284"/>
    <line x1="728" y1="0"   x2="728" y2="284"/>
    <line x1="875" y1="0"   x2="875" y2="284"/>
  </g>

  <!-- Grid lines horizontal -->
