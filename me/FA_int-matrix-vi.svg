    <text x="70" y="75">(Comp. 1)</text>
    <text x="70" y="101">Thành phần 2</text>
    <text x="70" y="113">(Comp. 2)</text>
    <text x="70" y="140">Thành phần 3</text>
    <text x="70" y="152">(Comp. 3)</text>
    <text x="70" y="179">Thành phần 4</text>
