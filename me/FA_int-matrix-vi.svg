  <!--                     cy of rows: 71,  110, 149, 188, 227, 266 -->

  <!-- Row 1 (Comp 1): grey | + | + | - | + | + -->
  <text x="360" y="71" text-anchor="middle" fill="#88cc88" font-size="16" font-weight="bold">+</text>
  <text x="507" y="71" text-anchor="middle" fill="#88cc88" font-size="16" font-weight="bold">+</text>
  <text x="654" y="71" text-anchor="middle" fill="#cc7777" font-size="16" font-weight="bold">-</text>
