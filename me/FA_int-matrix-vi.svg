  <text x="360" y="227" text-anchor="middle" fill="#cc7777" font-size="16" font-weight="bold">-</text>
  <text x="507" y="227" text-anchor="middle" fill="#88cc88" font-size="16" font-weight="bold">+</text>
  <text x="654" y="227" text-anchor="middle" fill="#88cc88" font-size="16" font-weight="bold">+</text>
  <text x="949" y="227" text-anchor="middle" fill="#cc7777" font-size="16" font-weight="bold">-</text>

  <!-- Row 6 (Comp 6): + | + | + | + | - | grey -->
  <text x="214" y="266" text-anchor="middle" fill="#88cc88" font-size="16" font-weight="bold">+</text>
  <text x="360" y="266" text-anchor="middle" fill="#88cc88" font-size="16" font-weight="bold">+</text>
  <text x="507" y="266" text-anchor="middle" fill="#88cc88" font-size="16" font-weight="bold">+</text>
