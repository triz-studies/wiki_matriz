<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 467" font-family="Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#AAA"/>
    </marker>
  </defs>

  <!-- Dark background -->
  <rect width="1024" height="467" fill="#111111"/>

  <!-- Side arrow (left) -->
  <line x1="30" y1="55" x2="30" y2="435" stroke="#888" stroke-width="2" marker-end="url(#arr)"/>
  <text x="8" y="52" font-size="11" fill="#888" writing-mode="lr">bất lợi đã biết</text>
  <text x="8" y="455" font-size="11" fill="#888">bất lợi ẩn</text>

  <!-- Dashed separator lines -->
  <line x1="55" y1="120" x2="870" y2="120" stroke="#444" stroke-width="1.5" stroke-dasharray="6,4"/>
  <line x1="55" y1="390" x2="870" y2="390" stroke="#444" stroke-width="1.5" stroke-dasharray="6,4"/>

  <!-- ── INITIAL DISADVANTAGE (top, salmon) ── -->
  <rect x="380" y="25" width="210" height="60" rx="8" fill="#FADCD9" stroke="#F0A090" stroke-width="1.5"/>
  <text x="485" y="51" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">bất lợi ban đầu</text>
  <text x="485" y="68" text-anchor="middle" font-size="11" fill="#666">(initial disadvantage)</text>

  <!-- ── ROW 1 ── -->
  <!-- function disadvantage (teal) -->
  <rect x="65" y="138" width="165" height="60" rx="8" fill="#C8E6E6" stroke="#88C0C0" stroke-width="1.5"/>
  <text x="148" y="162" text-anchor="middle" font-size="12" font-weight="bold" fill="#000">bất lợi chức năng</text>
  <text x="148" y="178" text-anchor="middle" font-size="10" fill="#555">(function disadvantage)</text>
  <line x1="148" y1="137" x2="420" y2="86" stroke="#AAA" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- other (new) disadvantage -->
  <rect x="253" y="138" width="165" height="60" rx="8" fill="#E8E8E8" stroke="#BBBBBB" stroke-width="1.5"/>
  <text x="336" y="162" text-anchor="middle" font-size="12" font-weight="bold" fill="#000">bất lợi khác (mới)</text>
  <text x="336" y="178" text-anchor="middle" font-size="10" fill="#555">(other new disadvantage)</text>
  <line x1="336" y1="137" x2="460" y2="86" stroke="#AAA" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- flow disadvantage (light blue) -->
  <rect x="445" y="138" width="165" height="60" rx="8" fill="#CCDFF5" stroke="#88AADD" stroke-width="1.5"/>
  <text x="528" y="162" text-anchor="middle" font-size="12" font-weight="bold" fill="#000">bất lợi luồng</text>
  <text x="528" y="178" text-anchor="middle" font-size="10" fill="#555">(flow disadvantage)</text>
  <line x1="528" y1="137" x2="500" y2="86" stroke="#AAA" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- cost disadvantage (light purple) -->
  <rect x="633" y="138" width="165" height="60" rx="8" fill="#E8D8F8" stroke="#BB99DD" stroke-width="1.5"/>
  <text x="716" y="162" text-anchor="middle" font-size="12" font-weight="bold" fill="#000">bất lợi chi phí</text>
  <text x="716" y="178" text-anchor="middle" font-size="10" fill="#555">(cost disadvantage)</text>
  <line x1="716" y1="137" x2="535" y2="86" stroke="#AAA" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- ── ROW 2 ── -->
  <rect x="65" y="222" width="165" height="60" rx="8" fill="#E8E8E8" stroke="#BBBBBB" stroke-width="1.5"/>
  <text x="148" y="246" text-anchor="middle" font-size="12" font-weight="bold" fill="#000">bất lợi khác (mới)</text>
  <text x="148" y="262" text-anchor="middle" font-size="10" fill="#555">(other new disadvantage)</text>
  <line x1="148" y1="221" x2="148" y2="200" stroke="#AAA" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect x="253" y="222" width="165" height="60" rx="8" fill="#C8E6E6" stroke="#88C0C0" stroke-width="1.5"/>
  <text x="336" y="246" text-anchor="middle" font-size="12" font-weight="bold" fill="#000">bất lợi chức năng</text>
  <text x="336" y="262" text-anchor="middle" font-size="10" fill="#555">(function disadvantage)</text>
  <line x1="336" y1="221" x2="336" y2="200" stroke="#AAA" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect x="445" y="222" width="165" height="60" rx="8" fill="#CCDFF5" stroke="#88AADD" stroke-width="1.5"/>
  <text x="528" y="246" text-anchor="middle" font-size="12" font-weight="bold" fill="#000">bất lợi chức năng</text>
  <text x="528" y="262" text-anchor="middle" font-size="10" fill="#555">(function disadvantage)</text>
  <line x1="528" y1="221" x2="528" y2="200" stroke="#AAA" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect x="633" y="222" width="165" height="60" rx="8" fill="#E8E8E8" stroke="#BBBBBB" stroke-width="1.5"/>
  <text x="716" y="246" text-anchor="middle" font-size="12" font-weight="bold" fill="#000">bất lợi khác (mới)</text>
  <text x="716" y="262" text-anchor="middle" font-size="10" fill="#555">(other new disadvantage)</text>
  <line x1="716" y1="221" x2="716" y2="200" stroke="#AAA" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- ── ROW 3 ── -->
  <rect x="253" y="305" width="165" height="60" rx="8" fill="#E8E8E8" stroke="#BBBBBB" stroke-width="1.5"/>
  <text x="336" y="329" text-anchor="middle" font-size="12" font-weight="bold" fill="#000">bất lợi khác (mới)</text>
  <text x="336" y="345" text-anchor="middle" font-size="10" fill="#555">(other new disadvantage)</text>
  <line x1="336" y1="304" x2="336" y2="284" stroke="#AAA" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect x="445" y="305" width="165" height="60" rx="8" fill="#E8E8E8" stroke="#BBBBBB" stroke-width="1.5"/>
  <text x="528" y="329" text-anchor="middle" font-size="12" font-weight="bold" fill="#000">bất lợi khác (mới)</text>
  <text x="528" y="345" text-anchor="middle" font-size="10" fill="#555">(other new disadvantage)</text>
  <line x1="528" y1="304" x2="528" y2="284" stroke="#AAA" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect x="633" y="305" width="165" height="60" rx="8" fill="#E8E8E8" stroke="#BBBBBB" stroke-width="1.5"/>
  <text x="716" y="329" text-anchor="middle" font-size="12" font-weight="bold" fill="#000">bất lợi khác (mới)</text>
  <text x="716" y="345" text-anchor="middle" font-size="10" fill="#555">(other new disadvantage)</text>
  <line x1="716" y1="304" x2="716" y2="284" stroke="#AAA" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- ── ROW 4: key disadvantages (green) ── -->
  <rect x="253" y="398" width="165" height="55" rx="8" fill="#D4EDD4" stroke="#88BB88" stroke-width="1.5"/>
  <text x="336" y="421" text-anchor="middle" font-size="12" font-weight="bold" fill="#000">bất lợi then chốt</text>
  <text x="336" y="437" text-anchor="middle" font-size="10" fill="#555">(key disadvantage)</text>
  <line x1="336" y1="397" x2="336" y2="367" stroke="#AAA" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect x="445" y="398" width="165" height="55" rx="8" fill="#D4EDD4" stroke="#88BB88" stroke-width="1.5"/>
  <text x="528" y="421" text-anchor="middle" font-size="12" font-weight="bold" fill="#000">bất lợi then chốt</text>
  <text x="528" y="437" text-anchor="middle" font-size="10" fill="#555">(key disadvantage)</text>
  <line x1="528" y1="397" x2="528" y2="367" stroke="#AAA" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect x="633" y="398" width="165" height="55" rx="8" fill="#D4EDD4" stroke="#88BB88" stroke-width="1.5"/>
  <text x="716" y="421" text-anchor="middle" font-size="12" font-weight="bold" fill="#000">bất lợi then chốt</text>
  <text x="716" y="437" text-anchor="middle" font-size="10" fill="#555">(key disadvantage)</text>
  <line x1="716" y1="397" x2="716" y2="367" stroke="#AAA" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Left bracket arrow: row2-col1 loops back to row1-col1 -->
  <line x1="64" y1="252" x2="46" y2="252" stroke="#AAA" stroke-width="1.5"/>
  <line x1="46" y1="252" x2="46" y2="168" stroke="#AAA" stroke-width="1.5"/>
  <line x1="46" y1="168" x2="64" y2="168" stroke="#AAA" stroke-width="1.5" marker-end="url(#arr)"/>

</svg>
