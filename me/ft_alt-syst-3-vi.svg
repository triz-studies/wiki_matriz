<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 185" font-family="Arial, sans-serif">

  <!-- Background -->
  <rect x="0" y="0" width="1024" height="185" fill="#2a2a2a"/>

  <!-- Header row backgrounds -->
  <rect x="320" y="0" width="340" height="50" fill="#3d3d3d"/>
  <rect x="660" y="0" width="364" height="50" fill="#3d3d3d"/>

  <!-- Header separators -->
  <line x1="320" y1="0" x2="320" y2="185" stroke="#555" stroke-width="1"/>
  <line x1="660" y1="0" x2="660" y2="185" stroke="#555" stroke-width="1"/>
  <line x1="0" y1="50" x2="1024" y2="50" stroke="#555" stroke-width="1"/>
  <line x1="0" y1="117" x2="1024" y2="117" stroke="#555" stroke-width="1"/>

  <!-- Main function label (top-left) -->
  <text x="10" y="20" font-size="11" fill="#aaa">chức năng chính:</text>
  <text x="10" y="36" font-size="11" font-weight="bold" fill="#ff6b6b">loại bỏ lực kết dính</text>

  <!-- Header text -->
  <text x="490" y="31" text-anchor="middle" font-weight="bold" font-size="14" fill="#f0f0f0">tiêu thụ nước</text>
  <text x="842" y="31" text-anchor="middle" font-weight="bold" font-size="14" fill="#f0f0f0">ứng dụng hộ gia đình</text>

  <!-- Row 1 label background -->
  <rect x="0" y="50" width="319" height="67" fill="#d6dff0"/>
  <!-- Row 2 label background -->
  <rect x="0" y="117" width="319" height="68" fill="#d6dff0"/>

  <!-- Row 1 label -->
  <text x="160" y="87" text-anchor="middle" font-weight="bold" font-size="13" fill="#1a1a2e">làm sạch bằng chất tẩy rửa</text>
  <text x="160" y="104" text-anchor="middle" font-weight="bold" font-size="13" fill="#1a1a2e">gốc nước</text>

  <!-- Row 2 label -->
  <text x="160" y="154" text-anchor="middle" font-weight="bold" font-size="13" fill="#1a1a2e">làm sạch bằng CO₂</text>
  <text x="160" y="171" text-anchor="middle" font-weight="bold" font-size="13" fill="#1a1a2e">siêu tới hạn</text>

  <!-- Row 1 / Col 1: water consumption - red X -->
  <text x="490" y="83" text-anchor="middle" font-size="26" fill="#e03030">✗</text>
  <text x="490" y="105" text-anchor="middle" font-style="italic" font-size="11" fill="#888">(lượng nước lớn cho mỗi chu kỳ giặt)</text>

  <!-- Row 1 / Col 2: household application - green check -->
  <text x="842" y="83" text-anchor="middle" font-size="26" fill="#22bb55">✓</text>
  <text x="842" y="105" text-anchor="middle" font-style="italic" font-size="11" fill="#888">(tiêu chuẩn cho hộ gia đình)</text>

  <!-- Row 2 / Col 1: water consumption - green check -->
  <text x="490" y="150" text-anchor="middle" font-size="26" fill="#22bb55">✓</text>
  <text x="490" y="172" text-anchor="middle" font-style="italic" font-size="11" fill="#888">(không sử dụng nước)</text>

  <!-- Row 2 / Col 2: household application - red X -->
  <text x="842" y="150" text-anchor="middle" font-size="26" fill="#e03030">✗</text>
  <text x="842" y="172" text-anchor="middle" font-style="italic" font-size="11" fill="#888">(yêu cầu áp suất ít nhất 7,38 MPa)</text>

</svg>
