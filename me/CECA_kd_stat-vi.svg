<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 290" font-family="Arial, sans-serif">
  <defs>
    <marker id="arrGreen" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#4A9A4A"/>
    </marker>
    <marker id="arrBlue" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#4A90D9"/>
    </marker>
    <marker id="arrDark" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#888"/>
    </marker>
  </defs>

  <!-- Dark background -->
  <rect width="1024" height="290" fill="#111111"/>

  <!-- ── BOXES ── -->
  <!-- CECA (gray) -->
  <rect x="30" y="25" width="290" height="80" rx="10" fill="#888888"/>
  <text x="175" y="72" text-anchor="middle" font-size="22" font-weight="bold" fill="white">CECA</text>

  <!-- Trimming (green) -->
  <rect x="680" y="25" width="310" height="70" rx="10" fill="#D4EDD4" stroke="#88BB88" stroke-width="1.5"/>
  <text x="835" y="52" text-anchor="middle" font-size="14" font-weight="bold" fill="#000">cắt tỉa</text>
  <text x="835" y="68" text-anchor="middle" font-size="12" fill="#555">(trimming)</text>

  <!-- Feature transfer (light blue) -->
  <rect x="30" y="195" width="290" height="75" rx="10" fill="#C8DFF0" stroke="#88AACC" stroke-width="1.5"/>
  <text x="175" y="226" text-anchor="middle" font-size="14" font-weight="bold" fill="#000">chuyển giao tính năng</text>
  <text x="175" y="244" text-anchor="middle" font-size="12" fill="#555">(feature transfer)</text>

  <!-- Key problems (white/light) -->
  <rect x="680" y="195" width="310" height="75" rx="10" fill="#EEEEEE" stroke="#BBBBBB" stroke-width="1.5"/>
  <text x="835" y="228" text-anchor="middle" font-size="15" font-weight="bold" fill="#000">vấn đề then chốt</text>
  <text x="835" y="248" text-anchor="middle" font-size="12" fill="#555">(key problems)</text>

  <!-- ── ARROWS ── -->

  <!-- CECA → trimming (green, diagonal up-right) -->
  <line x1="321" y1="45" x2="678" y2="45" stroke="#4A9A4A" stroke-width="2" marker-end="url(#arrGreen)"/>
  <!-- label above arrow -->
  <text x="500" y="38" text-anchor="middle" font-size="12" font-weight="bold" font-style="italic" fill="#6ABB6A">bất lợi then chốt (key disadvantage)</text>

  <!-- CECA → feature transfer (blue, straight down) -->
  <line x1="175" y1="106" x2="175" y2="193" stroke="#4A90D9" stroke-width="2" marker-end="url(#arrBlue)"/>
  <!-- label left of arrow -->
  <text x="8" y="148" font-size="12" font-weight="bold" font-style="italic" fill="#6AAAD9">bất lợi then chốt</text>
  <text x="8" y="163" font-size="12" font-weight="bold" font-style="italic" fill="#6AAAD9">(key disadvantage)</text>

  <!-- CECA → key problems (gray, diagonal down-right) -->
  <line x1="321" y1="80" x2="678" y2="210" stroke="#888" stroke-width="2" marker-end="url(#arrDark)"/>
  <!-- label along diagonal -->
  <text x="500" y="158" text-anchor="middle" font-size="12" font-weight="bold" font-style="italic" fill="#AAAAAA">bất lợi then chốt (key disadvantage)</text>

  <!-- trimming → key problems (green, straight down) -->
  <line x1="835" y1="96" x2="835" y2="193" stroke="#4A9A4A" stroke-width="2" marker-end="url(#arrGreen)"/>
  <!-- label right of arrow -->
  <text x="850" y="138" font-size="12" font-style="italic" fill="#6ABB6A">vấn đề cắt tỉa</text>
  <text x="850" y="153" font-size="11" font-style="italic" fill="#4A9A4A">(trimming problem)</text>

  <!-- feature transfer → key problems (blue, straight right) -->
  <line x1="321" y1="235" x2="678" y2="235" stroke="#4A90D9" stroke-width="2" marker-end="url(#arrBlue)"/>
  <!-- label above arrow -->
  <text x="500" y="228" text-anchor="middle" font-size="12" font-style="italic" fill="#6AAAD9">vấn đề chuyển giao tính năng</text>
  <text x="500" y="252" text-anchor="middle" font-size="11" font-style="italic" fill="#4A90D9">(feature transfer problem)</text>

</svg>
