<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 80" font-family="Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#ccc"/>
    </marker>
  </defs>

  <!-- Dark background -->
  <rect width="1024" height="80" fill="#222"/>

  <!--
    5 boxes, each 168px wide, 52px tall, centred vertically at y=14
    Gap between boxes = 30px (arrow space)
    Total = 5*168 + 4*30 = 840 + 120 = 960 → start x = (1024-960)/2 = 32
    Box centres x: 32+84=116, 116+168+30+84=398, ...
    Box x starts: 32, 230, 428, 626, 824
  -->

  <!-- Boxes -->
  <rect x="32"  y="14" width="168" height="52" rx="8" fill="#ececec" stroke="none"/>
  <rect x="230" y="14" width="168" height="52" rx="8" fill="#ececec" stroke="none"/>
  <rect x="428" y="14" width="168" height="52" rx="8" fill="#ececec" stroke="none"/>
  <rect x="626" y="14" width="168" height="52" rx="8" fill="#ececec" stroke="none"/>
  <rect x="824" y="14" width="168" height="52" rx="8" fill="#ececec" stroke="none"/>

  <!-- Arrows between boxes -->
  <line x1="202" y1="40" x2="228" y2="40" stroke="#ccc" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="400" y1="40" x2="426" y2="40" stroke="#ccc" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="598" y1="40" x2="624" y2="40" stroke="#ccc" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="796" y1="40" x2="822" y2="40" stroke="#ccc" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Labels -->
  <text x="116"  y="45" text-anchor="middle" font-size="14" fill="#222">thao tác 1</text>
  <text x="314"  y="45" text-anchor="middle" font-size="14" fill="#222">thao tác 2</text>
  <text x="512"  y="45" text-anchor="middle" font-size="14" fill="#222">thao tác 3</text>
  <text x="710"  y="45" text-anchor="middle" font-size="14" fill="#222">thao tác 4</text>
  <text x="908"  y="45" text-anchor="middle" font-size="14" fill="#222">thao tác 5</text>

</svg>
