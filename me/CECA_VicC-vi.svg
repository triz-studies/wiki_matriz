<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 595" font-family="Arial, sans-serif">
  <defs>
    <marker id="arrGray" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#888"/>
    </marker>
    <marker id="arrRed" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#CC2222"/>
    </marker>
  </defs>

  <!-- Dark background -->
  <rect width="1024" height="595" fill="#111111"/>

  <!--
    Layout (cx of center column = 512):
    Box width = 300, so x=362..662

    Row y positions (top of box):
      initial:   y=20,  h=55  → bottom=75,  cy=47
      level2:    y=110, h=55  → bottom=165, cy=137
      level3:    y=210, h=55  → bottom=265, cy=237
      OR circle: cy=320, r=22
      left-top:  y=365, h=55  → bottom=420, cy=392   x=80..340  cx=210
      left-mid:  y=445, h=55  → bottom=500, cy=472   x=80..340  cx=210
      left-bot:  y=525, h=55  → bottom=580, cy=552   x=80..340  cx=210
      right-top: y=365, h=55  → bottom=420, cy=392   x=680..940 cx=810
      right-bot: y=460, h=55  → bottom=515, cy=487   x=680..940 cx=810

    Red left rail: x=42
  -->

  <!-- ── INITIAL DISADVANTAGE (salmon) ── -->
  <rect x="362" y="20" width="300" height="55" rx="8" fill="#FADCD9" stroke="#F0A090" stroke-width="1.5"/>
  <text x="512" y="43" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">bất lợi ban đầu</text>
  <text x="512" y="62" text-anchor="middle" font-size="11" fill="#777">(initial disadvantage)</text>

  <!-- gray arrow: level2 → initial -->
  <line x1="512" y1="109" x2="512" y2="77" stroke="#888" stroke-width="1.8" marker-end="url(#arrGray)"/>

  <!-- ── LEVEL 2 ── -->
  <rect x="362" y="110" width="300" height="55" rx="8" fill="#EEEEEE" stroke="#CCCCCC" stroke-width="1.5"/>
  <text x="512" y="133" text-anchor="middle" font-size="14" font-weight="bold" fill="#000">bất lợi</text>
  <text x="512" y="152" text-anchor="middle" font-size="11" fill="#555">(disadvantage)</text>

  <!-- red arrow: level3 → level2 -->
  <line x1="512" y1="209" x2="512" y2="167" stroke="#CC2222" stroke-width="1.8" marker-end="url(#arrRed)"/>

  <!-- ── LEVEL 3 ── -->
  <rect x="362" y="210" width="300" height="55" rx="8" fill="#EEEEEE" stroke="#CCCCCC" stroke-width="1.5"/>
  <text x="512" y="233" text-anchor="middle" font-size="14" font-weight="bold" fill="#000">bất lợi</text>
  <text x="512" y="252" text-anchor="middle" font-size="11" fill="#555">(disadvantage)</text>

  <!-- red arrow: OR → level3 (upward) -->
  <line x1="512" y1="298" x2="512" y2="267" stroke="#CC2222" stroke-width="1.8" marker-end="url(#arrRed)"/>

  <!-- ── OR CIRCLE ── -->
  <circle cx="512" cy="320" r="22" fill="#2E3047"/>
  <text x="512" y="326" text-anchor="middle" font-size="13" font-weight="bold" fill="white">OR</text>

  <!-- ── LEFT TOP: disadvantage ── -->
  <rect x="80" y="365" width="260" height="55" rx="8" fill="#EEEEEE" stroke="#CCCCCC" stroke-width="1.5"/>
  <text x="210" y="388" text-anchor="middle" font-size="14" font-weight="bold" fill="#000">bất lợi</text>
  <text x="210" y="407" text-anchor="middle" font-size="11" fill="#555">(disadvantage)</text>
  <!-- red arrow: left-top → OR (horizontal right) -->
  <line x1="341" y1="392" x2="489" y2="320" stroke="#CC2222" stroke-width="1.8" marker-end="url(#arrRed)"/>

  <!-- ── LEFT MID: disadvantage ── -->
  <rect x="80" y="443" width="260" height="55" rx="8" fill="#EEEEEE" stroke="#CCCCCC" stroke-width="1.5"/>
  <text x="210" y="466" text-anchor="middle" font-size="14" font-weight="bold" fill="#000">bất lợi</text>
  <text x="210" y="485" text-anchor="middle" font-size="11" fill="#555">(disadvantage)</text>
  <!-- red arrow: left-mid → left-top -->
  <line x1="210" y1="442" x2="210" y2="422" stroke="#CC2222" stroke-width="1.8" marker-end="url(#arrRed)"/>

  <!-- ── LEFT BOT: disadvantage ── -->
  <rect x="80" y="523" width="260" height="55" rx="8" fill="#EEEEEE" stroke="#CCCCCC" stroke-width="1.5"/>
  <text x="210" y="546" text-anchor="middle" font-size="14" font-weight="bold" fill="#000">bất lợi</text>
  <text x="210" y="565" text-anchor="middle" font-size="11" fill="#555">(disadvantage)</text>
  <!-- red arrow: left-bot → left-mid -->
  <line x1="210" y1="522" x2="210" y2="500" stroke="#CC2222" stroke-width="1.8" marker-end="url(#arrRed)"/>

  <!-- ── RIGHT TOP: disadvantage ── -->
  <rect x="684" y="365" width="260" height="55" rx="8" fill="#EEEEEE" stroke="#CCCCCC" stroke-width="1.5"/>
  <text x="814" y="388" text-anchor="middle" font-size="14" font-weight="bold" fill="#000">bất lợi</text>
  <text x="814" y="407" text-anchor="middle" font-size="11" fill="#555">(disadvantage)</text>
  <!-- gray arrow: right-top → OR (horizontal left) -->
  <line x1="683" y1="392" x2="535" y2="320" stroke="#888" stroke-width="1.8" marker-end="url(#arrGray)"/>

  <!-- ── RIGHT BOT: disadvantage ── -->
  <rect x="684" y="460" width="260" height="55" rx="8" fill="#EEEEEE" stroke="#CCCCCC" stroke-width="1.5"/>
  <text x="814" y="483" text-anchor="middle" font-size="14" font-weight="bold" fill="#000">bất lợi</text>
  <text x="814" y="502" text-anchor="middle" font-size="11" fill="#555">(disadvantage)</text>
  <!-- gray arrow: right-bot → right-top -->
  <line x1="814" y1="459" x2="814" y2="422" stroke="#888" stroke-width="1.8" marker-end="url(#arrGray)"/>

  <!-- ── RED FEEDBACK LOOP (left rail) ──
       From left edge of level2 box → left rail down → 
       branch 1: → level2 (already shown as red arrow above, this is the horizontal entry)
       branch 2: → left-bot box right side
  -->
  <!-- horizontal from level2 left edge to rail -->
  <line x1="362" y1="137" x2="42" y2="137" stroke="#CC2222" stroke-width="1.8"/>
  <!-- vertical rail down -->
  <line x1="42" y1="137" x2="42" y2="550" stroke="#CC2222" stroke-width="1.8"/>
  <!-- branch right → left-bot box -->
  <line x1="42" y1="550" x2="79" y2="550" stroke="#CC2222" stroke-width="1.8" marker-end="url(#arrRed)"/>

</svg>
