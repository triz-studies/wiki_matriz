<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 480" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1400" height="480" fill="#f7f7f2" rx="8"/>

  <!-- ============ BOXES ============ -->

  <!-- phân tích chức năng (left, light blue with green left accent) -->
  <rect x="40" y="190" width="230" height="80" rx="5" fill="#dce8f5" stroke="#999" stroke-width="2"/>
  <rect x="40" y="190" width="6" height="80" rx="3" fill="#5ab55a"/>
  <text x="155" y="225" text-anchor="middle" fill="#111" font-size="16" font-weight="bold">phân tích</text>
  <text x="155" y="248" text-anchor="middle" fill="#111" font-size="16" font-weight="bold">chức năng</text>

  <!-- nhận diện dòng chảy (center, light blue) -->
  <rect x="450" y="190" width="240" height="80" rx="5" fill="#dce8f5" stroke="#999" stroke-width="2"/>
  <text x="570" y="225" text-anchor="middle" fill="#111" font-size="16" font-weight="bold">nhận diện</text>
  <text x="570" y="248" text-anchor="middle" fill="#111" font-size="16" font-weight="bold">dòng chảy</text>

  <!-- phân tích phân vùng dòng chảy (top-right, light blue) -->
  <rect x="830" y="90" width="250" height="80" rx="5" fill="#dce8f5" stroke="#999" stroke-width="2"/>
  <text x="955" y="122" text-anchor="middle" fill="#111" font-size="15" font-weight="bold">phân tích phân vùng</text>
  <text x="955" y="145" text-anchor="middle" fill="#111" font-size="15" font-weight="bold">dòng chảy</text>

  <!-- phân tích dòng chảy vận hành (bottom-right, light blue) -->
  <rect x="830" y="300" width="250" height="80" rx="5" fill="#dce8f5" stroke="#999" stroke-width="2"/>
  <text x="955" y="332" text-anchor="middle" fill="#111" font-size="15" font-weight="bold">phân tích dòng chảy</text>
  <text x="955" y="355" text-anchor="middle" fill="#111" font-size="15" font-weight="bold">vận hành</text>

  <!-- phân tích chuỗi nguyên nhân-kết quả (far right, grey) -->
  <rect x="1190" y="170" width="190" height="80" rx="5" fill="#e8e8e8" stroke="#999" stroke-width="2"/>
  <text x="1285" y="198" text-anchor="middle" fill="#111" font-size="14" font-weight="bold">phân tích chuỗi</text>
  <text x="1285" y="218" text-anchor="middle" fill="#111" font-size="14" font-weight="bold">nguyên nhân</text>
  <text x="1285" y="238" text-anchor="middle" fill="#111" font-size="14" font-weight="bold">- kết quả</text>

  <!-- ============ ARROWS ============ -->

  <!-- phân tích chức năng → nhận diện dòng chảy: "thành phần" -->
  <line x1="270" y1="230" x2="450" y2="230" stroke="#333" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="360" y="220" text-anchor="middle" fill="#666" font-size="14" font-style="italic">thành phần</text>

  <!-- nhận diện dòng chảy → splits to top and bottom
       Both arrows exit right side, go to a shared vertical line, then split -->

  <!-- Top branch: right side → up → right to flow partition analysis -->
  <polyline points="690,215 730,215 730,130 830,130" fill="none" stroke="#333" stroke-width="2.5" marker-end="url(#arrow)"/>
  <!-- "dòng chảy" label ABOVE the top horizontal segment -->
  <text x="770" y="118" text-anchor="middle" fill="#666" font-size="14" font-style="italic">dòng chảy</text>

  <!-- Bottom branch: right side → down → right to operational flow analysis -->
  <polyline points="690,245 730,245 730,340 830,340" fill="none" stroke="#333" stroke-width="2.5" marker-end="url(#arrow)"/>
  <!-- "dòng chảy" label BELOW the bottom horizontal segment -->
  <text x="770" y="358" text-anchor="middle" fill="#666" font-size="14" font-style="italic">dòng chảy</text>

  <!-- phân tích phân vùng dòng chảy → phân tích chuỗi: "nhược điểm phân vùng dòng chảy" -->
  <line x1="1080" y1="130" x2="1140" y2="130" stroke="#333" stroke-width="2.5"/>
  <polyline points="1140,130 1140,200 1190,200" fill="none" stroke="#333" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="1095" y="108" text-anchor="start" fill="#666" font-size="12" font-style="italic">nhược điểm phân vùng dòng chảy</text>

  <!-- phân tích dòng chảy vận hành → phân tích chuỗi: "nhược điểm dòng chảy vận hành" -->
  <line x1="1080" y1="340" x2="1140" y2="340" stroke="#333" stroke-width="2.5"/>
  <polyline points="1140,340 1140,230 1190,230" fill="none" stroke="#333" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="1085" y="375" text-anchor="start" fill="#666" font-size="12" font-style="italic">nhược điểm dòng chảy vận hành</text>

  <!-- phân tích chức năng top: "chức năng hữu ích, hạng hoặc loại chức năng" -->
  <polyline points="155,190 155,60 790,60 790,110 830,110" fill="none" stroke="#333" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="180" y="50" text-anchor="start" fill="#666" font-size="14" font-style="italic">chức năng hữu ích, hạng hoặc loại chức năng</text>

  <!-- phân tích chức năng bottom: "chức năng có hại, chức năng hữu ích không đầy đủ" -->
  <polyline points="155,270 155,420 790,420 790,360 830,360" fill="none" stroke="#333" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="180" y="440" text-anchor="start" fill="#666" font-size="14" font-style="italic">chức năng có hại, chức năng hữu ích không đầy đủ</text>

</svg>
