<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 234" font-family="Arial, sans-serif">

  <!-- Bright background -->
  <rect width="1200" height="234" fill="#f5f5f5"/>

  <!--
    Arrow body: x=60 to x=1130 tip, midline y=117
    Body y=98 to y=136 (height=38)
    Tick positions above: x=120 (monolith), x=500 (bristle), x=870 (spongy)
    Tick positions below: x=290 (plates), x=670 (pins/balls)
  -->

  <!-- Big light-blue arrow -->
  <polygon points="60,98 1100,98 1140,117 1100,136 60,136" fill="#B8CCE8" stroke="#8AAAC8" stroke-width="0.5"/>

  <!-- ── TICK MARKS ABOVE (pointing down) ── -->
  <polygon points="115,98 125,98 120,86" fill="#8AAAC8"/>
  <polygon points="495,98 505,98 500,86" fill="#8AAAC8"/>
  <polygon points="865,98 875,98 870,86" fill="#8AAAC8"/>

  <!-- ── TICK MARKS BELOW (pointing up) ── -->
  <polygon points="285,136 295,136 290,148" fill="#8AAAC8"/>
  <polygon points="665,136 675,136 670,148" fill="#8AAAC8"/>

  <!-- ── LABELS ABOVE ── -->

  <!-- monolith system -->
  <text x="120" y="60" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">hệ nguyên khối</text>
  <text x="120" y="75" text-anchor="middle" font-size="11" fill="#555">(monolith system)</text>

  <!-- bristle system -->
  <text x="500" y="60" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">hệ sợi cứng</text>
  <text x="500" y="75" text-anchor="middle" font-size="11" fill="#555">(bristle system)</text>

  <!-- spongy, porous system -->
  <text x="870" y="52" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">hệ xốp, có lỗ</text>
  <text x="870" y="67" text-anchor="middle" font-size="11" fill="#555">(spongy, porous system)</text>

  <!-- ── LABELS BELOW ── -->

  <!-- system in the form of a set of plates -->
  <text x="290" y="163" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">hệ dạng tập hợp tấm</text>
  <text x="290" y="178" text-anchor="middle" font-size="11" fill="#555">(system in the form</text>
  <text x="290" y="191" text-anchor="middle" font-size="11" fill="#555">of a set of plates)</text>

  <!-- system of moveable pins or balls -->
  <text x="670" y="163" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">hệ chốt hoặc bi di động</text>
  <text x="670" y="178" text-anchor="middle" font-size="11" fill="#555">(system of moveable</text>
  <text x="670" y="191" text-anchor="middle" font-size="11" fill="#555">pins or balls)</text>

</svg>
