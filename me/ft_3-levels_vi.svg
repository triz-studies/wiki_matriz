<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 188" font-family="Arial, sans-serif">
  <defs>
    <marker id="blueArr" markerWidth="12" markerHeight="9" refX="11" refY="4.5" orient="auto">
      <path d="M0,0 L12,4.5 L0,9 Z" fill="#2a8fd4"/>
    </marker>
  </defs>

  <!-- Dark background -->
  <rect width="1024" height="188" fill="#222"/>

  <!--
    Layout:
    - Blue arrow line at y=148, from x=20 to x=970
    - Dots at x=180, x=510, x=800  y=148
    - Dashed lines from dot up to box bottom
    - Box bottoms at y=128, so dashed line y=128→148
    - Box tops: box1 y=10 h=118, box2/3 y=20 h=100
  -->

  <!-- ── BOX 1: tích hợp vật lý ── -->
  <rect x="20" y="10" width="310" height="118" rx="12" fill="#f2f2f2" stroke="none"/>
  <text x="175" y="42" text-anchor="middle" font-size="16" font-weight="bold" fill="#111">tích hợp vật lý</text>
  <text x="175" y="66" text-anchor="middle" font-size="13" font-style="italic" fill="#444">(chuyển tính năng cùng với</text>
  <text x="175" y="84" text-anchor="middle" font-size="13" font-style="italic" fill="#444">thành phần vật lý của nó)</text>

  <!-- ── BOX 2: hỗn hợp ── -->
  <rect x="365" y="20" width="280" height="100" rx="12" fill="#f2f2f2" stroke="none"/>
  <text x="505" y="76" text-anchor="middle" font-size="16" font-weight="bold" fill="#111">hỗn hợp</text>

  <!-- ── BOX 3: chuyển tính năng thuần túy ── -->
  <rect x="690" y="20" width="314" height="100" rx="12" fill="#f2f2f2" stroke="none"/>
  <text x="847" y="76" text-anchor="middle" font-size="16" font-weight="bold" fill="#111">chuyển tính năng thuần túy</text>

  <!-- ── DASHED CONNECTORS (box bottom → dot) ── -->
  <!-- Box1 bottom ~128, dot at y=148 → line y=128→148, x=180 -->
  <line x1="180" y1="128" x2="180" y2="144" stroke="#666" stroke-width="1.5" stroke-dasharray="5,4"/>
  <!-- Box2 bottom ~120, dot at y=148, x=505 -->
  <line x1="505" y1="120" x2="505" y2="144" stroke="#666" stroke-width="1.5" stroke-dasharray="5,4"/>
  <!-- Box3 bottom ~120, dot at y=148, x=847 -->
  <line x1="847" y1="120" x2="847" y2="144" stroke="#666" stroke-width="1.5" stroke-dasharray="5,4"/>

  <!-- ── BLUE ARROW LINE ── -->
  <line x1="30" y1="148" x2="958" y2="148"
        stroke="#2a8fd4" stroke-width="3" marker-end="url(#blueArr)"/>

  <!-- ── DOTS ON LINE ── -->
  <circle cx="180" cy="148" r="10" fill="#111"/>
  <circle cx="505" cy="148" r="10" fill="#111"/>
  <circle cx="847" cy="148" r="10" fill="#111"/>

  <!-- ── AXIS LABEL ── -->
  <text x="990" y="170" text-anchor="end" font-size="13" font-style="italic" fill="#2a8fd4">mức độ đổi mới</text>

</svg>
