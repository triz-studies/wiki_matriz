<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 290" font-family="Arial, sans-serif">
  <defs>
    <marker id="arrGray" markerWidth="9" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <path d="M0,0 L9,3.5 L0,7 Z" fill="#888"/>
    </marker>
    <marker id="arrDark" markerWidth="9" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <path d="M0,0 L9,3.5 L0,7 Z" fill="#bbb"/>
    </marker>
  </defs>

  <!-- Dark background -->
  <rect width="1024" height="290" fill="#2a2a2a"/>

  <!-- ══════════════════════════════════════
       BOXES
       CECA:            x=40,  y=20,  w=280, h=90   → cx=180, cy=65
       trimming:        x=700, y=20,  w=280, h=90   → cx=840, cy=65
       feature transfer:x=40,  y=175, w=280, h=90   → cx=180, cy=220
       key problems:    x=700, y=175, w=280, h=90   → cx=840, cy=220
  ═══════════════════════════════════════ -->

  <!-- CECA box (light) -->
  <rect x="40" y="20" width="280" height="90" rx="10" fill="#DDDDDD"/>
  <text x="180" y="58" text-anchor="middle" font-size="16" font-weight="bold" fill="#000">CECA</text>
  <text x="180" y="76" text-anchor="middle" font-size="10" fill="#555">(Phân tích nguyên nhân-kết quả)</text>

  <!-- trimming box (light) -->
  <rect x="700" y="20" width="280" height="90" rx="10" fill="#DDDDDD"/>
  <text x="840" y="55" text-anchor="middle" font-size="16" font-weight="bold" fill="#000">cắt tỉa</text>
  <text x="840" y="73" text-anchor="middle" font-size="11" fill="#444">(trimming)</text>

  <!-- feature transfer box (light) -->
  <rect x="40" y="175" width="280" height="90" rx="10" fill="#DDDDDD"/>
  <text x="180" y="213" text-anchor="middle" font-size="14" font-weight="bold" fill="#000">chuyển giao tính năng</text>
  <text x="180" y="231" text-anchor="middle" font-size="11" fill="#555">(feature transfer)</text>

  <!-- key problems box (dark grey) -->
  <rect x="700" y="175" width="280" height="90" rx="10" fill="#666666"/>
  <text x="840" y="213" text-anchor="middle" font-size="15" font-weight="bold" font-style="italic" fill="#fff">vấn đề then chốt</text>
  <text x="840" y="231" text-anchor="middle" font-size="11" font-style="italic" fill="#ccc">(key problems)</text>

  <!-- ══════════════════════════════════════
       ARROWS
  ═══════════════════════════════════════ -->

  <!-- 1. CECA → trimming (horizontal, grey, labelled "key disadvantage") -->
  <line x1="321" y1="65" x2="698" y2="65" stroke="#888" stroke-width="1.5" marker-end="url(#arrGray)"/>
  <text x="510" y="55" text-anchor="middle" font-size="11" font-style="italic" fill="#999">bất lợi then chốt (key disadvantage)</text>

  <!-- 2. CECA → feature transfer (vertical down, grey, labelled "key disadvantage") -->
  <line x1="180" y1="111" x2="180" y2="173" stroke="#888" stroke-width="1.5" marker-end="url(#arrGray)"/>
  <!-- label with dark box behind it -->
  <rect x="95" y="128" width="170" height="18" rx="3" fill="#3a3a3a"/>
  <text x="180" y="141" text-anchor="middle" font-size="11" font-style="italic" fill="#888">bất lợi then chốt</text>

  <!-- 3. CECA → key problems (diagonal, bold dark, labelled "key disadvantage") -->
  <line x1="321" y1="100" x2="698" y2="208" stroke="#bbbbbb" stroke-width="2.5" marker-end="url(#arrDark)"/>
  <!-- bold label mid-diagonal -->
  <rect x="370" y="140" width="260" height="22" rx="3" fill="#2a2a2a"/>
  <text x="500" y="156" text-anchor="middle" font-size="13" font-weight="bold" fill="#eee">bất lợi then chốt</text>
  <text x="500" y="170" text-anchor="middle" font-size="10" fill="#888">(key disadvantage)</text>

  <!-- 4. trimming → key problems (vertical down, dark, labelled "trimming problem") -->
  <line x1="840" y1="111" x2="840" y2="173" stroke="#bbbbbb" stroke-width="2" marker-end="url(#arrDark)"/>
  <!-- bold label right of arrow -->
  <rect x="720" y="130" width="240" height="20" rx="3" fill="#2a2a2a"/>
  <text x="840" y="144" text-anchor="middle" font-size="12" font-weight="bold" font-style="italic" fill="#eee">vấn đề cắt tỉa</text>
  <text x="840" y="158" text-anchor="middle" font-size="10" fill="#888">(trimming problem)</text>

  <!-- 5. feature transfer → key problems (horizontal, bold dark, labelled "feature transfer problem") -->
  <line x1="321" y1="220" x2="698" y2="220" stroke="#bbbbbb" stroke-width="2.5" marker-end="url(#arrDark)"/>
  <!-- bold label above arrow -->
  <rect x="330" y="200" width="360" height="18" rx="3" fill="#2a2a2a"/>
  <text x="510" y="213" text-anchor="middle" font-size="12" font-weight="bold" font-style="italic" fill="#eee">vấn đề chuyển giao tính năng</text>
  <text x="510" y="228" text-anchor="middle" font-size="10" fill="#888">(feature transfer problem)</text>

</svg>
