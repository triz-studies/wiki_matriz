<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 273" font-family="Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#4A90D9"/>
    </marker>
  </defs>

  <!-- Dark background -->
  <rect width="1024" height="273" fill="#111111"/>

  <!-- ── TIMELINE ── -->
  <line x1="30" y1="215" x2="985" y2="215" stroke="#4A90D9" stroke-width="2.5" marker-end="url(#arr)"/>
  <text x="992" y="221" font-size="14" font-style="italic" font-weight="bold" fill="#4A90D9">time</text>

  <!-- ── SET 1 ── -->
  <rect x="55" y="15" width="210" height="165" rx="12" fill="#E8E8E8"/>
  <text x="160" y="38" text-anchor="middle" font-size="13" font-weight="bold" fill="#111">tập hợp thành phần</text>
  <text x="160" y="52" text-anchor="middle" font-size="11" fill="#555">(set of components)</text>
  <text x="160" y="82" text-anchor="middle" font-size="32" font-weight="bold" fill="#111">1</text>
  <text x="160" y="110" text-anchor="middle" font-size="12" fill="#444">thành phần A (component A)</text>
  <text x="160" y="128" text-anchor="middle" font-size="12" fill="#444">thành phần B (component B)</text>
  <text x="160" y="146" text-anchor="middle" font-size="12" fill="#444">thành phần C (component C)</text>
  <!-- dot + dashed line -->
  <line x1="160" y1="181" x2="160" y2="208" stroke="#666" stroke-width="1.5" stroke-dasharray="5,4"/>
  <circle cx="160" cy="215" r="6" fill="#cccccc"/>

  <!-- ── SET 2 ── -->
  <rect x="402" y="15" width="220" height="165" rx="12" fill="#E8E8E8"/>
  <text x="512" y="38" text-anchor="middle" font-size="13" font-weight="bold" fill="#111">tập hợp thành phần</text>
  <text x="512" y="52" text-anchor="middle" font-size="11" fill="#555">(set of components)</text>
  <text x="512" y="82" text-anchor="middle" font-size="32" font-weight="bold" fill="#111">2</text>
  <text x="512" y="110" text-anchor="middle" font-size="12" fill="#444">thành phần C (component C)</text>
  <text x="512" y="128" text-anchor="middle" font-size="12" fill="#444">thành phần D (component D)</text>
  <text x="512" y="146" text-anchor="middle" font-size="12" fill="#444">thành phần E (component E)</text>
  <!-- dot + dashed line -->
  <line x1="512" y1="181" x2="512" y2="208" stroke="#666" stroke-width="1.5" stroke-dasharray="5,4"/>
  <circle cx="512" cy="215" r="6" fill="#cccccc"/>

  <!-- ── SET 3 ── -->
  <rect x="758" y="15" width="210" height="165" rx="12" fill="#E8E8E8"/>
  <text x="863" y="38" text-anchor="middle" font-size="13" font-weight="bold" fill="#111">tập hợp thành phần</text>
  <text x="863" y="52" text-anchor="middle" font-size="11" fill="#555">(set of components)</text>
  <text x="863" y="82" text-anchor="middle" font-size="32" font-weight="bold" fill="#111">3</text>
  <text x="863" y="110" text-anchor="middle" font-size="12" fill="#444">thành phần F (component F)</text>
  <text x="863" y="128" text-anchor="middle" font-size="12" fill="#444">thành phần F (component F)</text>
  <text x="863" y="146" text-anchor="middle" font-size="12" fill="#444">thành phần G (component G)</text>
  <!-- dot + dashed line -->
  <line x1="863" y1="181" x2="863" y2="208" stroke="#666" stroke-width="1.5" stroke-dasharray="5,4"/>
  <circle cx="863" cy="215" r="6" fill="#cccccc"/>

</svg>
