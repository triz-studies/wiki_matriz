<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 196" font-family="Arial, sans-serif" font-size="14">
  <defs>
    <marker id="arrDark" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <path d="M0,0 L9,3.5 L0,7 Z" fill="#333"/>
    </marker>
    <marker id="arrLight" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <path d="M0,0 L9,3.5 L0,7 Z" fill="#eee"/>
    </marker>
  </defs>

  <!-- Brighter dark background for THEN/BUT rows -->
  <rect width="1024" height="196" fill="#484848"/>

  <!-- IF rows — white background -->
  <rect x="0"   y="0" width="460" height="72" fill="#f2f2f2"/>
  <rect x="564" y="0" width="460" height="72" fill="#f2f2f2"/>

  <!-- Row dividers -->
  <line x1="0"   y1="72"  x2="460"  y2="72"  stroke="#888" stroke-width="1"/>
  <line x1="564" y1="72"  x2="1024" y2="72"  stroke="#888" stroke-width="1"/>
  <line x1="0"   y1="134" x2="460"  y2="134" stroke="#666" stroke-width="1"/>
  <line x1="564" y1="134" x2="1024" y2="134" stroke="#666" stroke-width="1"/>

  <!-- ── LEFT COLUMN ── -->
  <!-- IF -->
  <text x="16" y="28" font-size="14" font-weight="bold" fill="#111">NẾU:</text>
  <text x="70" y="28" font-size="14" fill="#111"><tspan font-weight="bold">số lượng</tspan><tspan> phần tử gia cố dùng</tspan></text>
  <text x="70" y="50" font-size="14" fill="#111">trong thiết kế bàn <tspan font-weight="bold">là lớn</tspan></text>
  <!-- THEN -->
  <text x="16" y="103" font-size="14" font-weight="bold" fill="#eee">THÌ:</text>
  <text x="70" y="103" font-size="14" fill="#eee"><tspan font-weight="bold">độ bền</tspan><tspan> của bàn được cải thiện</tspan></text>
  <!-- BUT -->
  <text x="16" y="165" font-size="14" font-weight="bold" fill="#eee">NHƯNG:</text>
  <text x="90" y="165" font-size="14" fill="#eee"><tspan font-weight="bold">trọng lượng</tspan><tspan> của bàn tăng lên</tspan></text>

  <!-- ── RIGHT COLUMN ── -->
  <!-- IF -->
  <text x="580" y="28" font-size="14" font-weight="bold" fill="#111">NẾU:</text>
  <text x="634" y="28" font-size="14" fill="#111"><tspan font-weight="bold">số lượng</tspan><tspan> phần tử gia cố dùng</tspan></text>
  <text x="634" y="50" font-size="14" fill="#111">trong thiết kế bàn <tspan font-weight="bold">là nhỏ</tspan></text>
  <!-- THEN -->
  <text x="580" y="103" font-size="14" font-weight="bold" fill="#eee">THÌ:</text>
  <text x="634" y="103" font-size="14" fill="#eee"><tspan font-weight="bold">trọng lượng</tspan><tspan> của bàn giảm đi</tspan></text>
  <!-- BUT -->
  <text x="580" y="165" font-size="14" font-weight="bold" fill="#eee">NHƯNG:</text>
  <text x="654" y="165" font-size="14" fill="#eee"><tspan font-weight="bold">độ bền</tspan><tspan> của bàn giảm đi</tspan></text>

  <!-- ── CENTRE ARROWS ── -->
  <!-- IF → IF: dark arrow on white zone -->
  <line x1="464" y1="36" x2="560" y2="36"
        stroke="#333" stroke-width="2.5" marker-end="url(#arrDark)"/>

  <!-- Crossing arrows on dark zone: bright colour -->
  <!-- THEN-left → BUT-right -->
  <line x1="464" y1="100" x2="560" y2="160"
        stroke="#f0c040" stroke-width="2.5" marker-end="url(#arrLight)"/>
  <!-- BUT-left → THEN-right -->
  <line x1="464" y1="162" x2="560" y2="102"
        stroke="#f0c040" stroke-width="2.5" marker-end="url(#arrLight)"/>

</svg>
