<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 517" font-family="Arial, sans-serif">
  <defs>
    <marker id="arrX" markerWidth="9" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <path d="M0,0 L9,3.5 L0,7 Z" fill="#444"/>
    </marker>
    <marker id="arrY" markerWidth="9" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <path d="M0,0 L9,3.5 L0,7 Z" fill="#444"/>
    </marker>
  </defs>

  <!-- Bright background -->
  <rect width="1024" height="517" fill="#ffffff"/>
  <rect x="60" y="20" width="940" height="450" fill="#f8f8f8"/>

  <!-- ── AXES ── -->
  <line x1="60" y1="470" x2="60" y2="18" stroke="#444" stroke-width="1.8" marker-end="url(#arrY)"/>
  <line x1="60" y1="470" x2="1002" y2="470" stroke="#444" stroke-width="1.8" marker-end="url(#arrX)"/>

  <!-- Axis labels -->
  <text transform="translate(22,260) rotate(-90)" text-anchor="middle" font-size="13" font-style="italic" fill="#555">MPV</text>
  <text x="990" y="495" text-anchor="middle" font-size="13" font-style="italic" fill="#555">thời gian (time)</text>

  <!--
    S-CURVE matching PNG:
    Stage 1: flat low from x=70 to ~x=280
    Transitional: inflection, steep rise x=280 to x=520
    Stage 2: still rising but levelling x=520 to ~x=680
    Stage 3: near-flat at top x=680 to x=840
    Stage 4: slight decline x=840 to x=980
  -->
  <path d="
    M 70,440
    C 120,440 200,438 280,435
    C 330,432 360,410 390,370
    C 430,310 470,220 530,145
    C 570,100  620,80  680,75
    C 730,72   790,74  840,78
    C 890,84   940,105 980,135
  " fill="none" stroke="#2244BB" stroke-width="3" stroke-linecap="round"/>

  <!-- ── STAGE LABELS (bold, on/near curve) ── -->
  <!-- stage 1 -->
  <text x="160" y="462" text-anchor="middle" font-size="15" font-weight="bold" fill="#333">giai đoạn 1 (stage 1)</text>

  <!-- transitional stage -->
  <text x="330" y="418" text-anchor="middle" font-size="13" font-style="italic" fill="#555">giai đoạn chuyển tiếp</text>
  <text x="330" y="432" text-anchor="middle" font-size="11" fill="#888">(transitional stage)</text>

  <!-- stage 2 -->
  <text x="590" y="248" text-anchor="middle" font-size="15" font-weight="bold" fill="#333">giai đoạn 2 (stage 2)</text>

  <!-- stage 3 -->
  <text x="760" y="110" text-anchor="middle" font-size="15" font-weight="bold" fill="#333">giai đoạn 3 (stage 3)</text>

  <!-- stage 4 -->
  <text x="930" y="210" text-anchor="middle" font-size="15" font-weight="bold" fill="#333">giai đoạn 4 (stage 4)</text>

  <!-- ══════════════════════════════════
       FRACTION ANNOTATIONS (ΣF / ΣC)
       Using dark blue, fraction = numerator / line / denominator
       Arrows: ↑ = tăng, ↓ = giảm, const = hằng số
  ══════════════════════════════════ -->

  <!-- Stage 1: ΣF↑ / ΣC↓  (bottom left) -->
  <text x="100" y="355" text-anchor="middle" font-size="14" fill="#2244BB" font-weight="bold">ΣF ↑</text>
  <line x1="72" y1="362" x2="128" y2="362" stroke="#2244BB" stroke-width="1.5"/>
  <text x="100" y="378" text-anchor="middle" font-size="14" fill="#2244BB" font-weight="bold">ΣC ↓</text>

  <!-- Transitional stage: ΣF↑↑ / ΣC↓  (lower-mid) -->
  <text x="270" y="330" text-anchor="middle" font-size="14" fill="#2244BB" font-weight="bold">ΣF ↑↑</text>
  <line x1="238" y1="337" x2="302" y2="337" stroke="#2244BB" stroke-width="1.5"/>
  <text x="270" y="353" text-anchor="middle" font-size="14" fill="#2244BB" font-weight="bold">ΣC ↓</text>

  <!-- Stage 2: ΣF↑ / ΣC_const  (upper-mid) -->
  <text x="450" y="195" text-anchor="middle" font-size="14" fill="#2244BB" font-weight="bold">ΣF ↑</text>
  <line x1="414" y1="202" x2="486" y2="202" stroke="#2244BB" stroke-width="1.5"/>
  <text x="450" y="220" text-anchor="middle" font-size="13" fill="#2244BB" font-weight="bold">ΣC</text>
  <text x="478" y="225" text-anchor="start" font-size="10" fill="#2244BB">const</text>

  <!-- Stage 3: ΣF_const / ΣC↓  (top, near peak) -->
  <text x="720" y="42" text-anchor="middle" font-size="14" fill="#2244BB" font-weight="bold">ΣF</text>
  <text x="748" y="38" text-anchor="start" font-size="10" fill="#2244BB">const</text>
  <line x1="690" y1="46" x2="780" y2="46" stroke="#2244BB" stroke-width="1.5"/>
  <text x="735" y="62" text-anchor="middle" font-size="14" fill="#2244BB" font-weight="bold">ΣC ↓</text>

  <!-- Stage 4: ΣF↓ / ΣC↓↓  (top right) -->
  <text x="910" y="42" text-anchor="middle" font-size="14" fill="#2244BB" font-weight="bold">ΣF ↓</text>
  <line x1="878" y1="48" x2="942" y2="48" stroke="#2244BB" stroke-width="1.5"/>
  <text x="910" y="65" text-anchor="middle" font-size="14" fill="#2244BB" font-weight="bold">ΣC ↓↓</text>

</svg>
