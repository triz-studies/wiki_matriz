<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" font-family="Arial, sans-serif">

  <!-- Bright background -->
  <rect width="900" height="400" fill="#f5f7fa"/>

  <!-- ── TOP ROW: two white boxes ── -->

  <!-- Left box: function analysis -->
  <rect x="40" y="40" width="270" height="90" rx="8" fill="white" stroke="#cccccc" stroke-width="2"/>
  <text x="175" y="75" fill="#111111" font-size="15" font-weight="bold" text-anchor="middle">phân tích chức năng</text>
  <text x="175" y="97" fill="#444444" font-size="12" text-anchor="middle">(của thiết bị hoặc quy trình)</text>

  <!-- Right box: flow analysis -->
  <rect x="590" y="40" width="270" height="90" rx="8" fill="white" stroke="#cccccc" stroke-width="2"/>
  <text x="725" y="91" fill="#111111" font-size="15" font-weight="bold" text-anchor="middle">phân tích luồng</text>

  <!-- Arrow between boxes with label -->
  <defs>
    <marker id="arrow-gray" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#888888"/>
    </marker>
    <marker id="arrow-dark" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333333"/>
    </marker>
  </defs>

  <!-- Horizontal arrow top -->
  <line x1="312" y1="85" x2="588" y2="85" stroke="#888888" stroke-width="2" marker-end="url(#arrow-gray)"/>
  <!-- Label above arrow -->
  <text x="450" y="72" fill="#888888" font-size="12" font-style="italic" text-anchor="middle">mô hình chức năng</text>

  <!-- ── MIDDLE ROW: disadvantage labels ── -->

  <!-- Left label box -->
  <rect x="40" y="175" width="240" height="38" rx="5" fill="white" stroke="#bbbbbb" stroke-width="1.5"/>
  <text x="160" y="199" fill="#111111" font-size="13" font-weight="bold" font-style="italic" text-anchor="middle">bất lợi chức năng</text>

  <!-- Right label box -->
  <rect x="620" y="175" width="240" height="38" rx="5" fill="white" stroke="#bbbbbb" stroke-width="1.5"/>
  <text x="740" y="199" fill="#111111" font-size="13" font-weight="bold" font-style="italic" text-anchor="middle">bất lợi luồng</text>

  <!-- ── BOTTOM ROW: cause-effect chain analysis (blue box) ── -->
  <rect x="220" y="290" width="460" height="70" rx="10" fill="#2471b8"/>
  <text x="450" y="322" fill="white" font-size="16" font-weight="bold" font-style="italic" text-anchor="middle">phân tích chuỗi</text>
  <text x="450" y="344" fill="white" font-size="16" font-weight="bold" font-style="italic" text-anchor="middle">nguyên nhân - kết quả</text>

  <!-- ── CONNECTORS ── -->

  <!-- Left: from function analysis box down to disadvantage label -->
  <line x1="175" y1="130" x2="175" y2="175" stroke="#333333" stroke-width="2"/>

  <!-- Left: from disadvantage label down then right to blue box -->
  <line x1="175" y1="213" x2="175" y2="325" stroke="#333333" stroke-width="2"/>
  <line x1="175" y1="325" x2="218" y2="325" stroke="#333333" stroke-width="2" marker-end="url(#arrow-dark)"/>

  <!-- Right: from flow analysis box down to disadvantage label -->
  <line x1="725" y1="130" x2="725" y2="175" stroke="#333333" stroke-width="2"/>

  <!-- Right: from disadvantage label down then left to blue box -->
  <line x1="725" y1="213" x2="725" y2="325" stroke="#333333" stroke-width="2"/>
  <line x1="725" y1="325" x2="682" y2="325" stroke="#333333" stroke-width="2" marker-end="url(#arrow-dark)"/>

</svg>
