<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 266" font-family="Arial, sans-serif">
  <!-- Dark background -->
  <rect width="1024" height="266" fill="#2a2a2a"/>

  <!-- Box 1: physical contradiction (top-left, blue) -->
  <rect x="20" y="15" width="300" height="90" rx="8" fill="#C8DCF0"/>
  <text x="170" y="50" text-anchor="middle" font-size="14" font-weight="bold" fill="#000">mâu thuẫn vật lý</text>
  <text x="170" y="68" text-anchor="middle" font-size="12" fill="#333">(physical contradiction)</text>

  <!-- Arrow: horizontal → top row -->
  <rect x="328" y="50" width="295" height="26" fill="#aaa"/>
  <polygon points="623,38 668,63 623,88" fill="#aaa"/>
  <!-- Arrow label: italic, below arrow -->
  <text x="480" y="102" text-anchor="middle" font-size="12" font-style="italic" fill="#ccc">thuật toán giải mâu thuẫn vật lý</text>
  <text x="480" y="116" text-anchor="middle" font-size="11" font-style="italic" fill="#888">(algorithm for resolving physical contradictions)</text>

  <!-- Box 2: set of inventive principles (top-right, blue) -->
  <rect x="670" y="15" width="334" height="90" rx="8" fill="#C8DCF0"/>
  <text x="837" y="50" text-anchor="middle" font-size="13" font-weight="bold" fill="#000">tập hợp nguyên tắc sáng tạo</text>
  <text x="837" y="68" text-anchor="middle" font-size="11" fill="#333">(set of inventive principles)</text>

  <!-- Arrow: vertical ↓ right side -->
  <rect x="826" y="108" width="22" height="42" fill="#aaa"/>
  <polygon points="814,148 837,168 860,148" fill="#aaa"/>
  <!-- Arrow label: to the right -->
  <text x="865" y="138" font-size="12" font-style="italic" fill="#ccc">động não</text>
  <text x="865" y="152" font-size="11" font-style="italic" fill="#888">(brainstorming)</text>

  <!-- Box 3: specific problem (bottom-left, grey) -->
  <rect x="20" y="175" width="300" height="76" rx="8" fill="#DDDDDD"/>
  <text x="170" y="208" text-anchor="middle" font-size="14" font-weight="bold" fill="#000">vấn đề cụ thể</text>
  <text x="170" y="226" text-anchor="middle" font-size="12" fill="#333">(specific problem)</text>

  <!-- Arrow: vertical ↑ left side -->
  <rect x="159" y="108" width="22" height="42" fill="#aaa"/>
  <polygon points="147,112 170,92 193,112" fill="#aaa"/>
  <!-- Arrow label: to the left -->
  <text x="148" y="138" text-anchor="end" font-size="12" font-style="italic" fill="#ccc">mô hình hóa</text>
  <text x="148" y="152" text-anchor="end" font-size="11" font-style="italic" fill="#888">(modeling)</text>

  <!-- Box 4: specific solution (bottom-right, grey) -->
  <rect x="670" y="175" width="334" height="76" rx="8" fill="#DDDDDD"/>
  <text x="837" y="208" text-anchor="middle" font-size="14" font-weight="bold" fill="#000">giải pháp cụ thể</text>
  <text x="837" y="226" text-anchor="middle" font-size="12" fill="#333">(specific solution)</text>
</svg>
