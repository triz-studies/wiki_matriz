<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 216" font-family="Arial, sans-serif">
  <defs>
    <marker id="arrGray" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#999"/>
    </marker>
  </defs>

  <!-- Dark background -->
  <rect width="1024" height="216" fill="#111111"/>

  <!-- ── ENGINEERING SYSTEM DASHED BOUNDARY ── -->
  <rect x="215" y="15" width="575" height="178" rx="8" fill="none" stroke="#666" stroke-width="1.5" stroke-dasharray="8,5"/>
  <text x="430" y="208" font-size="12" font-style="italic" fill="#888">hệ thống kỹ thuật (engineering system)</text>

  <!-- ── SUPERSYSTEM COMPONENT 1 (blue hexagon, left top) ── -->
  <polygon points="10,44 30,24 185,24 205,54 185,84 30,84 10,84 10,44" fill="#7AADD4"/>
  <text x="107" y="49" text-anchor="middle" font-size="11" font-weight="bold" fill="#000">thành phần siêu hệ 1</text>
  <text x="107" y="64" text-anchor="middle" font-size="9"  fill="#333">(supersystem comp. 1)</text>
  <text x="107" y="78" text-anchor="middle" font-size="8"  fill="#555">— không có mũi tên —</text>

  <!-- ── SUPERSYSTEM COMPONENT 2 (blue hexagon, left bottom) ── -->
  <polygon points="10,130 30,110 185,110 205,140 185,170 30,170 10,170 10,130" fill="#7AADD4"/>
  <text x="107" y="135" text-anchor="middle" font-size="11" font-weight="bold" fill="#000">thành phần siêu hệ 2</text>
  <text x="107" y="150" text-anchor="middle" font-size="9"  fill="#333">(supersystem comp. 2)</text>
  <!-- arrow: sc3 → ss2 (pointing left OUT of system) -->
  <line x1="222" y1="144" x2="206" y2="144" stroke="#999" stroke-width="1.5" marker-end="url(#arrGray)"/>

  <!-- ── SYSTEM COMPONENT 1 (gray, top-left inside) ── -->
  <rect x="224" y="30" width="185" height="55" rx="6" fill="#AAAAAA"/>
  <text x="316" y="53" text-anchor="middle" font-size="12" font-weight="bold" fill="#000">thành phần hệ 1</text>
  <text x="316" y="70" text-anchor="middle" font-size="10" fill="#333">(system component 1)</text>

  <!-- ── SYSTEM COMPONENT 2 (gray, top-right inside) ── -->
  <rect x="505" y="30" width="185" height="55" rx="6" fill="#AAAAAA"/>
  <text x="597" y="53" text-anchor="middle" font-size="12" font-weight="bold" fill="#000">thành phần hệ 2</text>
  <text x="597" y="70" text-anchor="middle" font-size="10" fill="#333">(system component 2)</text>

  <!-- ── SYSTEM COMPONENT 3 (gray, bottom-left inside) ── -->
  <rect x="224" y="118" width="185" height="55" rx="6" fill="#AAAAAA"/>
  <text x="316" y="141" text-anchor="middle" font-size="12" font-weight="bold" fill="#000">thành phần hệ 3</text>
  <text x="316" y="158" text-anchor="middle" font-size="10" fill="#333">(system component 3)</text>

  <!-- ── SYSTEM COMPONENT 4 (gray, bottom-right inside) ── -->
  <rect x="505" y="118" width="185" height="55" rx="6" fill="#AAAAAA"/>
  <text x="597" y="141" text-anchor="middle" font-size="12" font-weight="bold" fill="#000">thành phần hệ 4</text>
  <text x="597" y="158" text-anchor="middle" font-size="10" fill="#333">(system component 4)</text>

  <!-- ══ ARROWS ══ -->
  <!-- 1. sc2 → target (horizontal right) -->
  <line x1="691" y1="57" x2="768" y2="57" stroke="#999" stroke-width="1.5" marker-end="url(#arrGray)"/>

  <!-- 2. sc1 bottom → down then right → sc3 top (L-shape) -->
  <line x1="316" y1="86"  x2="316" y2="100" stroke="#999" stroke-width="1.5"/>
  <line x1="316" y1="100" x2="411" y2="100" stroke="#999" stroke-width="1.5"/>
  <line x1="411" y1="100" x2="411" y2="118" stroke="#999" stroke-width="1.5" marker-end="url(#arrGray)"/>

  <!-- 3. sc2 → sc4 (vertical down) -->
  <line x1="597" y1="86" x2="597" y2="117" stroke="#999" stroke-width="1.5" marker-end="url(#arrGray)"/>

  <!-- 4. sc4 → target (diagonal up-right) -->
  <line x1="691" y1="133" x2="770" y2="80" stroke="#999" stroke-width="1.5" marker-end="url(#arrGray)"/>

  <!-- 5. sc4 → ss3 (horizontal right) -->
  <line x1="691" y1="155" x2="768" y2="155" stroke="#999" stroke-width="1.5" marker-end="url(#arrGray)"/>

  <!-- ── TARGET COMPONENT (yellow pill, right top) ── -->
  <rect x="770" y="34" width="210" height="52" rx="26" fill="#F5E060"/>
  <text x="875" y="55" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">thành phần mục tiêu</text>
  <text x="875" y="73" text-anchor="middle" font-size="10" fill="#666">(target component)</text>

  <!-- ── SUPERSYSTEM COMPONENT 3 (blue hexagon, right bottom) ── -->
  <polygon points="768,118 788,98 993,98 1013,128 993,172 788,172 768,172 768,118" fill="#7AADD4"/>
  <text x="890" y="130" text-anchor="middle" font-size="11" font-weight="bold" fill="#000">thành phần siêu hệ 3</text>
  <text x="890" y="145" text-anchor="middle" font-size="9"  fill="#333">(supersystem comp. 3)</text>

</svg>
