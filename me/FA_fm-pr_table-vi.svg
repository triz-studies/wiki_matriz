<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 331" font-family="Arial, sans-serif" font-size="11">

  <!-- Dark background -->
  <rect width="1024" height="331" fill="#2a2a2a"/>

  <!-- Header bg -->
  <rect x="0" y="0" width="1024" height="46" fill="#1a1a1a"/>

  <!-- Row group backgrounds (alternating sections) -->
  <rect x="0" y="46"  width="1024" height="106" fill="#282828"/>
  <rect x="0" y="152" width="1024" height="88"  fill="#242424"/>
  <rect x="0" y="240" width="1024" height="55"  fill="#282828"/>
  <rect x="0" y="295" width="1024" height="36"  fill="#242424"/>

  <!-- 
    Column x-centers:
    col1 (operation):        cx=62
    col2 (function carrier): cx=175
    col3 (action):           cx=268
    col4 (function object):  cx=358
    col5 (category):         cx=455
    col6 (function rank):    cx=572
    col7 (score):            cx=660
    col8 (performance level):cx=775
    col9 (total score):      cx=970

    Dividers at x: 120, 225, 312, 400, 510, 635, 685, 860
  -->

  <!-- ── VERTICAL DIVIDERS (full height) ── -->
  <g stroke="#444" stroke-width="0.8">
    <line x1="120" y1="0" x2="120" y2="331"/>
    <line x1="225" y1="0" x2="225" y2="331"/>
    <line x1="312" y1="0" x2="312" y2="331"/>
    <line x1="400" y1="0" x2="400" y2="331"/>
    <line x1="510" y1="0" x2="510" y2="331"/>
    <line x1="635" y1="0" x2="635" y2="331"/>
    <line x1="685" y1="0" x2="685" y2="331"/>
    <line x1="860" y1="0" x2="860" y2="331"/>
  </g>

  <!-- ── HORIZONTAL ROW DIVIDERS ── -->
  <g stroke="#444" stroke-width="0.8">
    <line x1="0" y1="46"  x2="1024" y2="46"/>
    <line x1="0" y1="71"  x2="1024" y2="71"/>
    <line x1="0" y1="96"  x2="1024" y2="96"/>
    <line x1="0" y1="121" x2="1024" y2="121"/>
  </g>
  <line x1="0" y1="152" x2="1024" y2="152" stroke="#666" stroke-width="1"/>
  <g stroke="#444" stroke-width="0.8">
    <line x1="0" y1="174" x2="1024" y2="174"/>
    <line x1="0" y1="198" x2="1024" y2="198"/>
    <line x1="0" y1="222" x2="1024" y2="222"/>
  </g>
  <line x1="0" y1="240" x2="1024" y2="240" stroke="#666" stroke-width="1"/>
  <line x1="0" y1="268" x2="1024" y2="268" stroke="#444" stroke-width="0.8"/>
  <line x1="0" y1="295" x2="1024" y2="295" stroke="#666" stroke-width="1"/>

  <!-- ── HEADER TEXT ── -->
  <g text-anchor="middle" font-weight="bold" fill="white" font-size="11">
    <text x="62"  y="20">thao tác</text>
    <text x="62"  y="33">(operation)</text>
    <text x="173" y="20">bộ phận mang</text>
    <text x="173" y="33">chức năng</text>
    <text x="268" y="20">hành động</text>
    <text x="268" y="33">(action)</text>
    <text x="356" y="20">đối tượng</text>
    <text x="356" y="33">chức năng</text>
    <text x="455" y="26">phân loại (category)</text>
    <text x="572" y="20">xếp hạng</text>
    <text x="572" y="33">chức năng</text>
    <text x="660" y="26">điểm (score)</text>
    <text x="773" y="20">mức thực hiện</text>
    <text x="773" y="33">(performance level)</text>
    <text x="942" y="20">tổng điểm</text>
    <text x="942" y="33">(total score)</text>
  </g>

  <!-- Helper macro: row y positions (center of text)
    Row 1a: y=60   Row 1b: y=84   Row 1c: y=109
    Row 2a: y=163  Row 2b: y=187  Row 2c: y=211
    Row 3a: y=255  Row 3b: y=282
    Row 4a: y=314
  -->

  <!-- ── OPERATION 1 label (spans 3 rows) ── -->
  <text x="62" y="83"  text-anchor="middle" fill="#888" font-size="10">thành phần</text>
  <text x="62" y="95"  text-anchor="middle" fill="#888" font-size="10">(thao tác) 1</text>

  <!-- Op1 Row A -->
  <text x="173" y="62" text-anchor="middle" fill="#666">bộ phận A</text>
  <text x="268" y="62" text-anchor="middle" fill="#aaa" font-weight="bold">hành động</text>
  <text x="356" y="62" text-anchor="middle" fill="#666">đối tượng X</text>
  <text x="455" y="62" text-anchor="middle" fill="#ccc">hữu ích <tspan fill="#4A9FDD" font-weight="bold">(U)</tspan></text>
  <text x="572" y="62" text-anchor="middle" fill="#ccc">sản xuất (productive)</text>
  <text x="660" y="62" text-anchor="middle" fill="#ccc">3</text>
  <text x="773" y="62" text-anchor="middle" fill="#ccc">bình thường (normal)</text>

  <!-- Op1 Row B -->
  <text x="173" y="87" text-anchor="middle" fill="#aaa" font-weight="bold">bộ phận B</text>
  <text x="268" y="87" text-anchor="middle" fill="#aaa" font-weight="bold">hành động</text>
  <text x="356" y="87" text-anchor="middle" fill="#aaa" font-weight="bold">đối tượng Y</text>
  <text x="455" y="87" text-anchor="middle" fill="#ccc">hữu ích <tspan fill="#4A9FDD" font-weight="bold">(U)</tspan></text>
  <text x="572" y="87" text-anchor="middle" fill="#ccc">cung cấp S (providing S)</text>
  <text x="660" y="87" text-anchor="middle" fill="#ccc">2</text>
  <text x="773" y="87" text-anchor="middle" fill="#ccc">quá mức (excessive)</text>
  <text x="942" y="84" text-anchor="middle" fill="white" font-weight="bold" font-size="13">6</text>

  <!-- Op1 Row C -->
  <text x="173" y="112" text-anchor="middle" fill="#aaa" font-weight="bold">bộ phận B</text>
  <text x="268" y="112" text-anchor="middle" fill="#aaa" font-weight="bold">hành động</text>
  <text x="356" y="112" text-anchor="middle" fill="#aaa" font-weight="bold">đối tượng W</text>
  <text x="455" y="112" text-anchor="middle" fill="#ccc">hữu ích <tspan fill="#4A9FDD" font-weight="bold">(U)</tspan></text>
  <text x="572" y="112" text-anchor="middle" fill="#ccc">sửa chữa (corrective)</text>
  <text x="660" y="112" text-anchor="middle" fill="#ccc">1</text>
  <text x="773" y="112" text-anchor="middle" fill="#ccc">không đủ (insufficient)</text>

  <!-- ── OPERATION 2 label ── -->
  <text x="62" y="180" text-anchor="middle" fill="#888" font-size="10">thành phần</text>
  <text x="62" y="192" text-anchor="middle" fill="#888" font-size="10">(thao tác) 2</text>

  <!-- Op2 Row A -->
  <text x="173" y="165" text-anchor="middle" fill="#aaa" font-weight="bold">bộ phận A</text>
  <text x="268" y="165" text-anchor="middle" fill="#aaa" font-weight="bold">hành động</text>
  <text x="356" y="165" text-anchor="middle" fill="#aaa" font-weight="bold">đối tượng Z</text>
  <text x="455" y="165" text-anchor="middle" fill="#ccc">hữu ích <tspan fill="#4A9FDD" font-weight="bold">(U)</tspan></text>
  <text x="572" y="165" text-anchor="middle" fill="#ccc">cung cấp T (providing T)</text>
  <text x="660" y="165" text-anchor="middle" fill="#ccc">2</text>
  <text x="773" y="165" text-anchor="middle" fill="#ccc">bình thường (normal)</text>
  <text x="942" y="187" text-anchor="middle" fill="white" font-weight="bold" font-size="13">4</text>

  <!-- Op2 Row B -->
  <text x="173" y="189" text-anchor="middle" fill="#666">bộ phận C</text>
  <text x="268" y="189" text-anchor="middle" fill="#aaa" font-weight="bold">hành động</text>
  <text x="356" y="189" text-anchor="middle" fill="#666">đối tượng W</text>
  <text x="455" y="189" text-anchor="middle" fill="#ccc">hữu ích <tspan fill="#4A9FDD" font-weight="bold">(U)</tspan></text>
  <text x="572" y="189" text-anchor="middle" fill="#ccc">cung cấp M (providing M)</text>
  <text x="660" y="189" text-anchor="middle" fill="#ccc">2</text>
  <text x="773" y="189" text-anchor="middle" fill="#ccc">bình thường (normal)</text>

  <!-- Op2 Row C -->
  <text x="173" y="213" text-anchor="middle" fill="#666">bộ phận C</text>
  <text x="268" y="213" text-anchor="middle" fill="#aaa" font-weight="bold">hành động</text>
  <text x="356" y="213" text-anchor="middle" fill="#666">đối tượng Y</text>
  <text x="455" y="213" text-anchor="middle" fill="#ccc">có hại <tspan fill="#CC3333" font-weight="bold">(H)</tspan></text>
  <text x="572" y="213" text-anchor="middle" fill="#555">--</text>
  <text x="660" y="213" text-anchor="middle" fill="#555">--</text>
  <text x="773" y="213" text-anchor="middle" fill="#555">--</text>

  <!-- ── OPERATION 3 label ── -->
  <text x="62" y="258" text-anchor="middle" fill="#888" font-size="10">thành phần</text>
  <text x="62" y="270" text-anchor="middle" fill="#888" font-size="10">(thao tác) 3</text>

  <!-- Op3 Row A -->
  <text x="173" y="253" text-anchor="middle" fill="#aaa" font-weight="bold">bộ phận A</text>
  <text x="268" y="253" text-anchor="middle" fill="#aaa" font-weight="bold">hành động</text>
  <text x="356" y="253" text-anchor="middle" fill="#aaa" font-weight="bold">đối tượng Y</text>
  <text x="455" y="253" text-anchor="middle" fill="#ccc">hữu ích <tspan fill="#4A9FDD" font-weight="bold">(U)</tspan></text>
  <text x="572" y="253" text-anchor="middle" fill="#ccc">cung cấp S (providing S)</text>
  <text x="660" y="253" text-anchor="middle" fill="#ccc">2</text>
  <text x="773" y="253" text-anchor="middle" fill="#ccc">bình thường (normal)</text>
  <text x="942" y="270" text-anchor="middle" fill="white" font-weight="bold" font-size="13">4</text>

  <!-- Op3 Row B -->
  <text x="173" y="281" text-anchor="middle" fill="#666">bộ phận D</text>
  <text x="268" y="281" text-anchor="middle" fill="#aaa" font-weight="bold">hành động</text>
  <text x="356" y="281" text-anchor="middle" fill="#666">đối tượng T</text>
  <text x="455" y="281" text-anchor="middle" fill="#ccc">hữu ích <tspan fill="#4A9FDD" font-weight="bold">(U)</tspan></text>
  <text x="572" y="281" text-anchor="middle" fill="#ccc">cung cấp S (providing S)</text>
  <text x="660" y="281" text-anchor="middle" fill="#ccc">2</text>
  <text x="773" y="281" text-anchor="middle" fill="#ccc">không đủ (insufficient)</text>

  <!-- ── OPERATION 4 label ── -->
  <text x="62" y="311" text-anchor="middle" fill="#888" font-size="10">thành phần</text>
  <text x="62" y="323" text-anchor="middle" fill="#888" font-size="10">(thao tác) 4</text>

  <!-- Op4 Row A -->
  <text x="173" y="314" text-anchor="middle" fill="#666">bộ phận D</text>
  <text x="268" y="314" text-anchor="middle" fill="#aaa" font-weight="bold">hành động</text>
  <text x="356" y="314" text-anchor="middle" fill="#666">đối tượng Y</text>
  <text x="455" y="314" text-anchor="middle" fill="#ccc">hữu ích <tspan fill="#4A9FDD" font-weight="bold">(U)</tspan></text>
  <text x="572" y="314" text-anchor="middle" fill="#ccc">cung cấp T (providing T)</text>
  <text x="660" y="314" text-anchor="middle" fill="#ccc">2</text>
  <text x="773" y="314" text-anchor="middle" fill="#ccc">bình thường (normal)</text>
  <text x="942" y="314" text-anchor="middle" fill="white" font-weight="bold" font-size="13">3</text>

  <!-- Outer border -->
  <rect x="0" y="0" width="1024" height="331" fill="none" stroke="#555" stroke-width="1"/>

</svg>
