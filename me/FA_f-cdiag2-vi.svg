<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 743" font-family="Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="8" refX="10" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#1C2B45"/>
    </marker>
  </defs>

  <!-- White background -->
  <rect width="1024" height="743" fill="#ffffff"/>

  <!-- Quadrant D shading: bottom-right, light blue — drawn first so everything renders on top -->
  <rect x="480" y="370" width="510" height="320" fill="#D6E8F5" opacity="0.6"/>

  <!-- Axes -->
  <line x1="80"  y1="690" x2="80"  y2="28"  stroke="#1C2B45" stroke-width="2.5" marker-end="url(#arr)"/>
  <line x1="80"  y1="690" x2="998" y2="690" stroke="#1C2B45" stroke-width="2.5" marker-end="url(#arr)"/>

  <!-- Axis labels -->
  <text transform="rotate(-90, 32, 380)" x="32" y="380"
        text-anchor="middle" font-size="18" font-weight="bold" font-style="italic" fill="#1C2B45">chỉ số chức năng</text>
  <text x="958" y="730" text-anchor="middle" font-size="18" font-weight="bold" font-style="italic" fill="#1C2B45">chi phí</text>

  <!-- Diagonal line from origin to top-right -->
  <line x1="80" y1="690" x2="970" y2="42" stroke="#1C2B45" stroke-width="1.8"/>

  <!-- Quadrant dividers (dashed) -->
  <!-- Horizontal mid-line -->
  <line x1="80"  y1="370" x2="990" y2="370" stroke="#666" stroke-width="1.5" stroke-dasharray="9,6"/>
  <!-- Vertical mid-line -->
  <line x1="480" y1="30"  x2="480" y2="690" stroke="#666" stroke-width="1.5" stroke-dasharray="9,6"/>

  <!-- Quadrant labels — large, light watermark style -->
  <!-- A: top-left -->
  <text x="255" y="295" font-size="110" font-weight="bold" fill="#CCCCCC" opacity="0.7">A</text>
  <!-- B: bottom-left -->
  <text x="210" y="620" font-size="110" font-weight="bold" fill="#CCCCCC" opacity="0.7">B</text>
  <!-- C: top-right -->
  <text x="680" y="295" font-size="110" font-weight="bold" fill="#A8C8E8" opacity="0.6">C</text>
  <!-- D: bottom-right -->
  <text x="680" y="620" font-size="110" font-weight="bold" fill="#A8C8E8" opacity="0.6">D</text>

  <!-- ===================== DATA POINTS ===================== -->

  <!-- thành phần 1 — top-left quadrant, high func low cost -->
  <circle cx="218" cy="108" r="8" fill="#1C2B45"/>
  <text x="232" y="103" font-size="13" fill="#1C2B45">thành phần 1</text>

  <!-- thành phần 2 -->
  <circle cx="312" cy="200" r="8" fill="#1C2B45"/>
  <text x="326" y="195" font-size="13" fill="#1C2B45">thành phần 2</text>

  <!-- thành phần 10 -->
  <circle cx="368" cy="292" r="8" fill="#1C2B45"/>
  <text x="382" y="287" font-size="13" fill="#1C2B45">thành phần 10</text>

  <!-- thành phần 11 — just left of vertical divider, high func -->
  <circle cx="455" cy="152" r="8" fill="#1C2B45"/>
  <text x="350" y="147" font-size="13" fill="#1C2B45">thành phần 11</text>

  <!-- thành phần 6 — top-right quadrant -->
  <circle cx="628" cy="108" r="8" fill="#1C2B45"/>
  <text x="530" y="103" font-size="13" fill="#1C2B45">thành phần 6</text>

  <!-- thành phần 9 — top-right, very high cost -->
  <circle cx="808" cy="124" r="8" fill="#1C2B45"/>
  <text x="822" y="119" font-size="13" fill="#1C2B45">thành phần 9</text>

  <!-- thành phần 5 — upper-right, below diagonal -->
  <circle cx="672" cy="282" r="8" fill="#1C2B45"/>
  <text x="686" y="277" font-size="13" fill="#1C2B45">thành phần 5</text>

  <!-- thành phần 8 — lower-left, just below horizontal -->
  <circle cx="292" cy="408" r="8" fill="#1C2B45"/>
  <text x="200" y="403" font-size="13" fill="#1C2B45">thành phần 8</text>

  <!-- thành phần 3 — bottom-right, just right of vertical divider -->
  <circle cx="548" cy="415" r="8" fill="#1C2B45"/>
  <text x="562" y="410" font-size="13" fill="#1C2B45">thành phần 3</text>

  <!-- thành phần 13 — lower-left quadrant -->
  <circle cx="430" cy="508" r="8" fill="#1C2B45"/>
  <text x="340" y="503" font-size="13" fill="#1C2B45">thành phần 13</text>

  <!-- thành phần 7 — bottom-right quadrant -->
  <circle cx="612" cy="502" r="8" fill="#1C2B45"/>
  <text x="626" y="497" font-size="13" fill="#1C2B45">thành phần 7</text>

  <!-- thành phần 4 — very bottom-left -->
  <circle cx="284" cy="614" r="8" fill="#1C2B45"/>
  <text x="196" y="609" font-size="13" fill="#1C2B45">thành phần 4</text>

  <!-- thành phần 12 — very bottom-right -->
  <circle cx="724" cy="624" r="8" fill="#1C2B45"/>
  <text x="738" y="619" font-size="13" fill="#1C2B45">thành phần 12</text>

</svg>
