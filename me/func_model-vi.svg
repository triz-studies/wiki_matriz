<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 120" font-family="Arial, Helvetica, sans-serif">

  <!-- Background -->
  <rect width="900" height="120" fill="#f7f7f2" rx="6"/>

  <!-- chất mang chức năng (left box) -->
  <rect x="20" y="20" width="270" height="80" rx="4" fill="#f0f0f0" stroke="#555" stroke-width="2"/>
  <text x="155" y="67" text-anchor="middle" fill="#222" font-size="18">chất mang chức năng</text>

  <!-- hoạt động (arrow shape in center) -->
  <polygon points="340,25 520,25 560,60 520,95 340,95" fill="#aaa"/>
  <text x="440" y="67" text-anchor="middle" fill="#fff" font-size="17" font-style="italic">hành động</text>

  <!-- đối tượng chức năng (right box) -->
  <rect x="610" y="20" width="270" height="80" rx="4" fill="#f0f0f0" stroke="#555" stroke-width="2"/>
  <text x="745" y="67" text-anchor="middle" fill="#222" font-size="18">đối tượng chức năng</text>

</svg>
