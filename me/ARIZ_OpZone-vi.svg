<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 175" font-family="Arial, sans-serif">
  <defs>
    <pattern id="redHatch" patternUnits="userSpaceOnUse" width="10" height="10" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="10" stroke="#E05555" stroke-width="2.5"/>
    </pattern>
    <pattern id="blueHatch" patternUnits="userSpaceOnUse" width="10" height="10" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="10" stroke="#5577E0" stroke-width="2.5"/>
    </pattern>
    <pattern id="overlapHatch" patternUnits="userSpaceOnUse" width="10" height="10" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="10" stroke="#9966CC" stroke-width="2.5"/>
    </pattern>
  </defs>

  <!-- LEFT: SEPARATED -->
  <path d="M10,140 Q70,28 160,28 Q250,28 250,140 Z" fill="url(#redHatch)" stroke="#222" stroke-width="2.5"/>
  <path d="M280,140 Q280,28 370,28 Q460,28 460,140 Z" fill="url(#blueHatch)" stroke="#222" stroke-width="2.5"/>
  <line x1="5" y1="140" x2="465" y2="140" stroke="#222" stroke-width="3"/>
  <text x="10" y="160" font-size="15" font-weight="bold" fill="#222">OZ-1</text>
  <text x="435" y="160" font-size="15" font-weight="bold" fill="#222">OZ-2</text>
  <text x="235" y="162" font-size="14" font-style="italic" text-anchor="middle" fill="#555">Tách biệt</text>

  <!-- RIGHT: OVERLAPPING -->
  <path d="M555,140 Q555,28 660,28 Q765,28 765,140 Z" fill="url(#redHatch)" stroke="#222" stroke-width="2.5"/>
  <path d="M660,140 Q660,28 765,28 Q870,28 870,140 Z" fill="url(#blueHatch)" stroke="#222" stroke-width="2.5"/>
  <path d="M660,140 Q660,28 765,28 Q765,140 660,140 Z" fill="url(#overlapHatch)" stroke="none" opacity="0.65"/>
  <path d="M555,140 Q555,28 660,28 Q765,28 765,140 Z" fill="none" stroke="#222" stroke-width="2.5"/>
  <path d="M660,140 Q660,28 765,28 Q870,28 870,140 Z" fill="none" stroke="#222" stroke-width="2.5"/>
  <line x1="550" y1="140" x2="875" y2="140" stroke="#222" stroke-width="3"/>
  <text x="555" y="160" font-size="15" font-weight="bold" fill="#222">OZ-1</text>
  <text x="848" y="160" font-size="15" font-weight="bold" fill="#222">OZ-2</text>
  <text x="712" y="162" font-size="14" font-style="italic" text-anchor="middle" fill="#555">Chồng lấp</text>
</svg>
