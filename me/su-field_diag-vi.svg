<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 280" font-family="Arial, sans-serif">

  <!--
    GEOMETRY PLAN
    ─────────────────────────────────────────────────────
    Canvas: 1024 × 280

    TOP ROW   (blue boxes)  — cy = 70,  box h = 76
      TL box:  x=20   y=32   w=300  h=76   → right edge = 320
      TR box:  x=704  y=32   w=300  h=76   → left edge  = 704   cx=854

    BOTTOM ROW (grey boxes) — cy = 210, box h = 60
      BL box:  x=20   y=180  w=300  h=60   cx=170
      BR box:  x=704  y=180  w=300  h=60   cx=854

    HORIZONTAL ARROW (→)
      Body: x1=328  y1=50  →  x2=688  y2=88  (shaft top/bottom, head tip at x=704)
      Shaft: y=50..88  (38px tall), head tip x=704

    UP ARROW (↑) left   — centered on TL/BL cx=170
      Shaft: x=152..188  (36px wide)
      Shaft bottom: y=178  (top of BL box − 2)
      Shaft top:    y=120
      Head tip:     y=108  (bottom of TL box = 108)
      Head base:    y=120
      Half-width of head: 26px  → x: 144..196

    DOWN ARROW (↓) right — centered on TR/BR cx=854
      Shaft: x=836..872  (36px wide)
      Shaft top:    y=110  (bottom of TR box = 108, +2 gap)
      Shaft bottom: y=168
      Head base:    y=168
      Head tip:     y=180  (top of BR box)
      Half-width of head: 26px → x: 828..880
    ─────────────────────────────────────────────────────
  -->

  <!-- Background -->
  <rect width="1024" height="280" fill="#f0f0f0"/>

  <!-- ══════════════════════════════════════
       TOP-LEFT blue box  x=20 y=32 w=300 h=76  (bottom=108)
  ══════════════════════════════════════ -->
  <rect x="20" y="32" width="300" height="76" rx="10"
        fill="#cce0f5" stroke="#99bbdd" stroke-width="1.5"/>
  <text x="170" y="67" text-anchor="middle" font-size="15" font-weight="bold" fill="#111">Su-Field của bài toán</text>

  <!-- ══════════════════════════════════════
       HORIZONTAL FAT ARROW →
       Shaft: y=50..88, x=320..676; head tip x=704
  ══════════════════════════════════════ -->
  <polygon points="
    320,50
    676,50
    676,32
    704,69
    676,106
    676,88
    320,88
  " fill="#b0b0b0"/>
  <!-- Arrow label (italic, below arrow) -->
  <text x="512" y="124" text-anchor="middle" font-size="12" font-style="italic" fill="#666">hệ thống 76 giải pháp phát minh tiêu chuẩn</text>

  <!-- ══════════════════════════════════════
       TOP-RIGHT blue box  x=704 y=32 w=300 h=76  (bottom=108)
  ══════════════════════════════════════ -->
  <rect x="704" y="32" width="300" height="76" rx="10"
        fill="#cce0f5" stroke="#99bbdd" stroke-width="1.5"/>
  <text x="854" y="60" text-anchor="middle" font-size="13" fill="#222">giải pháp phát minh tiêu chuẩn</text>
  <text x="854" y="79" text-anchor="middle" font-size="12" fill="#444">(đôi khi là <tspan font-weight="bold">Su-Field của giải pháp</tspan>)</text>

  <!-- ══════════════════════════════════════
       VERTICAL UP ARROW ↑  (left, cx=170)
       Head tip touches bottom of TL box at y=108
       Shaft bottom touches top of BL box at y=180
  ══════════════════════════════════════ -->
  <!-- shaft: x=152..188, y=122..180 -->
  <rect x="152" y="122" width="36" height="58" fill="#b0b0b0"/>
  <!-- head: tip at (170,108), base at y=122, half-w=26 → x=144..196 -->
  <polygon points="170,108 196,122 144,122" fill="#b0b0b0"/>
  <!-- label right of arrow -->
  <text x="202" y="158" font-size="12" font-style="italic" fill="#666">mô hình hóa</text>

  <!-- ══════════════════════════════════════
       VERTICAL DOWN ARROW ↓  (right, cx=854)
       Shaft top at y=110 (just below TR box bottom=108)
       Head tip at y=180 (top of BR box)
  ══════════════════════════════════════ -->
  <!-- shaft: x=836..872, y=110..168 -->
  <rect x="836" y="110" width="36" height="58" fill="#b0b0b0"/>
  <!-- head: base at y=168, tip at (854,180), half-w=26 → x=828..880 -->
  <polygon points="854,180 880,168 828,168" fill="#b0b0b0"/>
  <!-- label right of arrow -->
  <text x="886" y="148" font-size="12" font-style="italic" fill="#666">động não</text>

  <!-- ══════════════════════════════════════
       BOTTOM-LEFT grey box  x=20 y=180 w=300 h=60
  ══════════════════════════════════════ -->
  <rect x="20" y="180" width="300" height="60" rx="10"
        fill="#d8d8d8" stroke="#aaa" stroke-width="1.5"/>
  <text x="170" y="216" text-anchor="middle" font-size="15" font-weight="bold" fill="#222">bài toán cụ thể</text>

  <!-- ══════════════════════════════════════
       BOTTOM-RIGHT grey box  x=704 y=180 w=300 h=60
  ══════════════════════════════════════ -->
  <rect x="704" y="180" width="300" height="60" rx="10"
        fill="#d8d8d8" stroke="#aaa" stroke-width="1.5"/>
  <text x="854" y="216" text-anchor="middle" font-size="15" font-weight="bold" fill="#222">giải pháp cụ thể</text>

</svg>
