<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 147" font-family="Arial, sans-serif">
  <defs>
    <marker id="arrRed" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#D94040"/>
    </marker>
    <marker id="arrBlue" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#4A6ED9"/>
    </marker>
    <marker id="arrGray" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#888"/>
    </marker>
  </defs>

  <!-- Dark background -->
  <rect width="1024" height="147" fill="#111111"/>

  <!-- ══════════════ OR SECTION (left) ══════════════ -->

  <!-- Top box → OR (gray arrow going DOWN into OR) -->
  <rect x="155" y="8" width="200" height="52" rx="8" fill="white" stroke="#CCC" stroke-width="1.5"/>
  <text x="255" y="29" text-anchor="middle" font-size="13" font-weight="bold" fill="#000">bất lợi</text>
  <text x="255" y="47" text-anchor="middle" font-size="11" fill="#555">(disadvantage)</text>
  <!-- gray arrow from top box down to OR -->
  <line x1="255" y1="61" x2="255" y2="83" stroke="#888" stroke-width="1.8" marker-end="url(#arrGray)"/>

  <!-- OR circle -->
  <circle cx="255" cy="97" r="22" fill="#444455"/>
  <text x="255" y="103" text-anchor="middle" font-size="13" font-weight="bold" fill="white">OR</text>

  <!-- Left box → OR (red arrow pointing right into OR) -->
  <rect x="10" y="70" width="180" height="55" rx="8" fill="white" stroke="#CCC" stroke-width="1.5"/>
  <text x="100" y="93" text-anchor="middle" font-size="13" font-weight="bold" fill="#000">bất lợi</text>
  <text x="100" y="111" text-anchor="middle" font-size="11" fill="#555">(disadvantage)</text>
  <line x1="191" y1="97" x2="231" y2="97" stroke="#D94040" stroke-width="1.8" marker-end="url(#arrRed)"/>

  <!-- Right box → OR (blue arrow pointing left into OR) -->
  <rect x="320" y="70" width="180" height="55" rx="8" fill="white" stroke="#CCC" stroke-width="1.5"/>
  <text x="410" y="93" text-anchor="middle" font-size="13" font-weight="bold" fill="#000">bất lợi</text>
  <text x="410" y="111" text-anchor="middle" font-size="11" fill="#555">(disadvantage)</text>
  <line x1="319" y1="97" x2="279" y2="97" stroke="#4A6ED9" stroke-width="1.8" marker-end="url(#arrBlue)"/>

  <!-- ══════════════ AND SECTION (right) ══════════════ -->

  <!-- Top box → AND (gray arrow going DOWN into AND) -->
  <rect x="640" y="8" width="200" height="52" rx="8" fill="white" stroke="#CCC" stroke-width="1.5"/>
  <text x="740" y="29" text-anchor="middle" font-size="13" font-weight="bold" fill="#000">bất lợi</text>
  <text x="740" y="47" text-anchor="middle" font-size="11" fill="#555">(disadvantage)</text>
  <!-- gray arrow from top box down to AND -->
  <line x1="740" y1="61" x2="740" y2="83" stroke="#888" stroke-width="1.8" marker-end="url(#arrGray)"/>

  <!-- AND circle -->
  <circle cx="740" cy="97" r="22" fill="#D94040"/>
  <text x="740" y="103" text-anchor="middle" font-size="13" font-weight="bold" fill="white">AND</text>

  <!-- Left-of-AND box → AND (red arrow pointing right into AND) -->
  <rect x="510" y="70" width="180" height="55" rx="8" fill="white" stroke="#CCC" stroke-width="1.5"/>
  <text x="600" y="93" text-anchor="middle" font-size="13" font-weight="bold" fill="#000">bất lợi</text>
  <text x="600" y="111" text-anchor="middle" font-size="11" fill="#555">(disadvantage)</text>
  <line x1="691" y1="97" x2="716" y2="97" stroke="#D94040" stroke-width="1.8" marker-end="url(#arrRed)"/>

  <!-- Right-of-AND box → AND (red arrow pointing left into AND) -->
  <rect x="834" y="70" width="180" height="55" rx="8" fill="white" stroke="#CCC" stroke-width="1.5"/>
  <text x="924" y="93" text-anchor="middle" font-size="13" font-weight="bold" fill="#000">bất lợi</text>
  <text x="924" y="111" text-anchor="middle" font-size="11" fill="#555">(disadvantage)</text>
  <line x1="833" y1="97" x2="764" y2="97" stroke="#D94040" stroke-width="1.8" marker-end="url(#arrRed)"/>

</svg>
