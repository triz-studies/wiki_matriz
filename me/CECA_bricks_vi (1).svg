<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 249" font-family="Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <path d="M0,0 L10,3.5 L0,7 Z" fill="#aaa"/>
    </marker>
  </defs>

  <!-- Black background -->
  <rect width="1024" height="249" fill="#111"/>

  <!-- Top-left box: phân tích chức năng -->
  <rect x="20" y="18" width="330" height="74" rx="6" fill="white" stroke="white" stroke-width="2"/>
  <text x="175" y="52" text-anchor="middle" font-size="17" font-weight="bold" fill="#111">phân tích chức năng</text>
  <text x="175" y="74" text-anchor="middle" font-size="13" fill="#444">(của thiết bị hoặc quy trình)</text>

  <!-- Arrow: function analysis → flow analysis -->
  <line x1="352" y1="55" x2="618" y2="55" stroke="#aaa" stroke-width="1.8" marker-end="url(#arr)"/>
  <!-- Label box on arrow -->
  <rect x="398" y="37" width="125" height="22" rx="3" fill="#e8e8e8" stroke="#ccc" stroke-width="1"/>
  <text x="461" y="52" text-anchor="middle" font-size="12" font-style="italic" fill="#555">mô hình chức năng</text>

  <!-- Top-right box: phân tích luồng -->
  <rect x="622" y="18" width="282" height="74" rx="6" fill="white" stroke="white" stroke-width="2"/>
  <text x="763" y="61" text-anchor="middle" font-size="17" font-weight="bold" fill="#111">phân tích luồng</text>

  <!-- Left side label: bất lợi chức năng -->
  <text x="20" y="132" font-size="14" font-weight="bold" font-style="italic" fill="white">bất lợi chức năng</text>

  <!-- Right side label: bất lợi luồng -->
  <text x="762" y="132" font-size="14" font-weight="bold" font-style="italic" fill="white">bất lợi luồng</text>

  <!-- Bottom blue box: phân tích chuỗi nhân quả -->
  <rect x="262" y="170" width="500" height="62" rx="10" fill="#2a7fd4"/>
  <text x="512" y="207" text-anchor="middle" font-size="17" font-weight="bold" font-style="italic" fill="white">phân tích chuỗi nhân-quả</text>
</svg>
