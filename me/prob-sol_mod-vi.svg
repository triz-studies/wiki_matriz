<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 380" font-family="Arial, Helvetica, sans-serif">

  <!-- Background -->
  <rect width="1100" height="380" fill="#f7f7f2" rx="8"/>

  <!-- ============ BOXES ============ -->

  <!-- mô hình vấn đề (top-left, light blue) -->
  <rect x="40" y="30" width="320" height="80" rx="6" fill="#d0e4f5" stroke="#8ab5d5" stroke-width="2"/>
  <text x="200" y="78" text-anchor="middle" fill="#111" font-size="20" font-weight="bold">mô hình vấn đề</text>

  <!-- mô hình giải pháp (top-right, light blue) -->
  <rect x="740" y="30" width="320" height="80" rx="6" fill="#d0e4f5" stroke="#8ab5d5" stroke-width="2"/>
  <text x="900" y="78" text-anchor="middle" fill="#111" font-size="20" font-weight="bold">mô hình giải pháp</text>

  <!-- vấn đề cụ thể (bottom-left, grey) -->
  <rect x="40" y="260" width="320" height="80" rx="6" fill="#eaeaea" stroke="#aaa" stroke-width="2"/>
  <text x="200" y="308" text-anchor="middle" fill="#111" font-size="20" font-weight="bold">vấn đề cụ thể</text>

  <!-- giải pháp cụ thể (bottom-right, grey) -->
  <rect x="740" y="260" width="320" height="80" rx="6" fill="#eaeaea" stroke="#aaa" stroke-width="2"/>
  <text x="900" y="308" text-anchor="middle" fill="#111" font-size="20" font-weight="bold">giải pháp cụ thể</text>

  <!-- ============ ARROW: mô hình hóa (up, vấn đề cụ thể → mô hình vấn đề) ============ -->
  <polygon points="175,245 225,245 225,175 250,175 200,130 150,175 175,175" fill="#bbb"/>
  <text x="145" y="210" text-anchor="end" fill="#777" font-size="16" font-style="italic">mô hình hóa</text>

  <!-- ============ ARROW: horizontal (mô hình vấn đề → mô hình giải pháp) ============ -->
  <polygon points="400,55 400,85 700,85 700,100 740,70 700,40 700,55" fill="#bbb"/>
  <text x="550" y="130" text-anchor="middle" fill="#777" font-size="15" font-style="italic">công cụ phù hợp được sử dụng</text>
  <text x="550" y="150" text-anchor="middle" fill="#777" font-size="15" font-style="italic">để xử lý mô hình vấn đề</text>

  <!-- ============ ARROW: động não (down, mô hình giải pháp → giải pháp cụ thể) ============ -->
  <polygon points="875,125 925,125 925,195 950,195 900,240 850,195 875,195" fill="#bbb"/>
  <text x="965" y="170" text-anchor="start" fill="#777" font-size="16" font-style="italic">động não</text>

</svg>
