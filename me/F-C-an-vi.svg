<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 768 432" font-family="Arial, sans-serif">
  <defs>
    <!-- Gradient for left arrow -->
    <linearGradient id="arrowGradL" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#b0b0b0"/>
      <stop offset="100%" stop-color="#606060"/>
    </linearGradient>
    <!-- Gradient for right arrow -->
    <linearGradient id="arrowGradR" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#b0b0b0"/>
      <stop offset="100%" stop-color="#606060"/>
    </linearGradient>
    <marker id="dashArr" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <path d="M0,0 L9,3.5 L0,7 Z" fill="#888"/>
    </marker>
  </defs>

  <!-- ── BACKGROUND ── -->
  <rect width="768" height="432" fill="#222"/>

  <!-- ══════════════════════════════════════════
       TOP BOX: phân tích chức năng – chi phí
       Centred, wide, light blue
       x=184, y=18, w=400, h=52
  ══════════════════════════════════════════ -->
  <rect x="184" y="18" width="400" height="52" rx="10" fill="#cce0f5" stroke="none"/>
  <text x="384" y="50" text-anchor="middle" font-size="17" fill="#1a1a1a">phân tích chức năng – chi phí</text>

  <!-- ══════════════════════════════════════════
       T-JUNCTION CONNECTOR
       Top box bottom centre: (384, 70)
       Vertical → (384, 112)
       Horizontal bar: (88, 112) → (636, 112)
       Left drop: (88, 112) → (88, 148)
       Right drop: (636, 112) → (636, 238)   [down to cost box top]
  ══════════════════════════════════════════ -->
  <line x1="384" y1="70"  x2="384" y2="112" stroke="#666" stroke-width="2"/>
  <line x1="88"  y1="112" x2="636" y2="112" stroke="#666" stroke-width="2"/>
  <line x1="88"  y1="112" x2="88"  y2="148" stroke="#666" stroke-width="2"/>
  <line x1="636" y1="112" x2="636" y2="238" stroke="#666" stroke-width="2"/>

  <!-- ══════════════════════════════════════════
       LEFT BOX: phân tích chức năng
       x=22, y=148, w=370, h=180
       Item 3 sits at y≈ 148+50+28+28+28 = row mid ~278
  ══════════════════════════════════════════ -->
  <rect x="22" y="148" width="370" height="180" rx="10" fill="#f4f4f4" stroke="none"/>
  <!-- Title -->
  <text x="44" y="182" font-size="16" fill="#111">phân tích chức năng</text>
  <!-- Items — large, well-spaced -->
  <text x="58" y="216" font-size="15" fill="#222">1.  phân tích thành phần</text>
  <text x="58" y="252" font-size="15" fill="#222">2.  phân tích tương tác</text>
  <text x="58" y="288" font-size="15" fill="#222">3.  mô hình hoá chức năng</text>

  <!-- ══════════════════════════════════════════
       DASHED HORIZONTAL LINE: item3 right → cost box left
       Item 3 at y=288, left box right edge x=392, cost box left x=462
  ══════════════════════════════════════════ -->
  <line x1="392" y1="288" x2="460" y2="288"
        stroke="#888" stroke-width="2"
        stroke-dasharray="8,5"
        marker-end="url(#dashArr)"/>

  <!-- ══════════════════════════════════════════
       RIGHT BOX: phân tích chi phí
       Vertically centred on item3 row (y=288), height=52 → y=262
       x=462, w=280
  ══════════════════════════════════════════ -->
  <rect x="462" y="262" width="280" height="52" rx="10" fill="#f4f4f4" stroke="none"/>
  <text x="602" y="293" text-anchor="middle" font-size="16" fill="#111">phân tích chi phí</text>

  <!-- ══════════════════════════════════════════
       CHUNKY GRADIENT DOWN ARROWS
       Left: centred under left box  cx=207, top of arrow=334
       Right: centred under right box cx=602, top of arrow=320
       Arrow shape: stem + wide head (chevron)
       Stem: 20px wide, Head: 56px wide
  ══════════════════════════════════════════ -->

  <!-- Left arrow — cx=207 -->
  <!-- stem: x=197..217, y=334..368 | head: x=179..235, y=368..400 -->
  <polygon points="197,334 197,368 179,368 207,402 235,368 217,368 217,334"
           fill="url(#arrowGradL)"/>

  <!-- Right arrow — cx=602 -->
  <!-- stem: x=592..612, y=320..354 | head: x=574..630, y=354..386 -->
  <polygon points="592,320 592,354 574,354 602,388 630,354 612,354 612,320"
           fill="url(#arrowGradR)"/>

  <!-- ══════════════════════════════════════════
       LABELS BELOW ARROWS
  ══════════════════════════════════════════ -->
  <text x="207" y="422" text-anchor="middle" font-size="14" font-weight="bold" font-style="italic" fill="#ddd">bất lợi chức năng</text>
  <text x="602" y="408" text-anchor="middle" font-size="14" font-weight="bold" font-style="italic" fill="#ddd">bất lợi chi phí</text>

</svg>
