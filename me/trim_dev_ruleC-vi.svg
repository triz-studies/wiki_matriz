<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 321" font-family="Arial, sans-serif">

  <!-- Bright background -->
  <rect width="1024" height="321" fill="#f0f0f0"/>

  <!-- ── ROW 1 ── -->

  <!-- BOX 1: crossed function carrier (top-left) -->
  <rect x="18" y="20" width="290" height="110" rx="8" fill="#ffffff" stroke="#cccccc" stroke-width="1.5"/>
  <text x="163" y="68" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">bộ phận mang chức năng</text>
  <text x="163" y="86" text-anchor="middle" font-size="11" fill="#777">(function carrier)</text>
  <!-- Red X -->
  <line x1="22"  y1="24"  x2="304" y2="126" stroke="#DD2222" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="304" y1="24"  x2="22"  y2="126" stroke="#DD2222" stroke-width="3.5" stroke-linecap="round"/>

  <!-- GREY "if" ARROW (center) -->
  <polygon points="360,52 490,52 490,38 558,75 490,112 490,98 360,98" fill="#888888"/>
  <text x="452" y="81" text-anchor="middle" font-size="17" font-weight="bold" fill="#ffffff">nếu (if)</text>

  <!-- BOX 2: function object (top-right) -->
  <rect x="578" y="20" width="290" height="110" rx="8" fill="#ffffff" stroke="#cccccc" stroke-width="1.5"/>
  <text x="723" y="65" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">đối tượng chức năng</text>
  <text x="723" y="83" text-anchor="middle" font-size="11" fill="#777">(function object)</text>

  <!-- ── ROW 2 ── -->

  <!-- BOX 3: different component / function carrier (bottom-left) -->
  <rect x="18" y="185" width="290" height="110" rx="8" fill="#ffffff" stroke="#cccccc" stroke-width="1.5"/>
  <text x="163" y="230" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">thành phần khác</text>
  <text x="163" y="248" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">(bộ phận mang chức năng)</text>
  <text x="163" y="266" text-anchor="middle" font-size="10" fill="#777">(different component / function carrier)</text>

  <!-- ── BLUE L-SHAPED ARROW: from bottom-left box → up to function object box ── -->
  <!--
    Path: starts at right edge of box3 (x=308, y=240)
    goes right to x=723
    then curves up
    then arrowhead pointing up into box2 bottom (x=723, y=132)
  -->
  <!-- Horizontal + vertical L path with rounded corner -->
  <path d="M 308,240 C 560,240 680,240 720,240 C 748,240 748,220 748,185 L 748,138"
        fill="none" stroke="#6AAAD4" stroke-width="13" stroke-linecap="butt" stroke-linejoin="round"/>
  <!-- Arrowhead pointing UP at top of vertical segment (tip at y=132) -->
  <polygon points="732,140 748,112 764,140" fill="#6AAAD4"/>

</svg>
