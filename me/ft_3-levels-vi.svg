<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 188" font-family="Arial, sans-serif">

  <!-- Dark background -->
  <rect width="1024" height="188" fill="#111111"/>

  <!--
    Layout:
    Timeline y = 130
    Dots at x = 160, 500, 800
    Boxes above: y=20, height=70
  -->

  <!-- ── TIMELINE ARROW ── -->
  <line x1="50" y1="130" x2="960" y2="130" stroke="#2255CC" stroke-width="10" stroke-linecap="round"/>
  <polygon points="958,120 990,130 958,140" fill="#2255CC"/>

  <!-- axis label -->
  <text x="988" y="155" font-size="11" fill="#4477EE" font-style="italic" text-anchor="end">mức độ đổi mới (level of innovation)</text>

  <!-- ── DOTS ── -->
  <circle cx="160" cy="130" r="10" fill="#111" stroke="white" stroke-width="2.5"/>
  <circle cx="500" cy="130" r="10" fill="#111" stroke="white" stroke-width="2.5"/>
  <circle cx="800" cy="130" r="10" fill="#111" stroke="white" stroke-width="2.5"/>

  <!-- ── DASHED LINES dot → box ── -->
  <line x1="160" y1="119" x2="160" y2="92" stroke="#666" stroke-width="1.5" stroke-dasharray="5,3"/>
  <line x1="500" y1="119" x2="500" y2="92" stroke="#666" stroke-width="1.5" stroke-dasharray="5,3"/>
  <line x1="800" y1="119" x2="800" y2="92" stroke="#666" stroke-width="1.5" stroke-dasharray="5,3"/>

  <!-- ── BOX 1: physical integration (wide, 2-line subtitle) ── -->
  <rect x="30" y="12" width="260" height="78" rx="8" fill="#E8E8E8" stroke="#BBBBBB" stroke-width="1"/>
  <text x="160" y="33" text-anchor="middle" font-size="12" font-weight="bold" fill="#000">tích hợp vật lý</text>
  <text x="160" y="49" text-anchor="middle" font-size="10" fill="#444">(physical integration)</text>
  <text x="160" y="64" text-anchor="middle" font-size="9" font-style="italic" fill="#666">chuyển giao tính năng cùng</text>
  <text x="160" y="78" text-anchor="middle" font-size="9" font-style="italic" fill="#666">thành phần vật lý của nó</text>

  <!-- ── BOX 2: mixture ── -->
  <rect x="390" y="20" width="220" height="70" rx="8" fill="#E8E8E8" stroke="#BBBBBB" stroke-width="1"/>
  <text x="500" y="48" text-anchor="middle" font-size="12" font-weight="bold" fill="#000">hỗn hợp</text>
  <text x="500" y="64" text-anchor="middle" font-size="10" fill="#555">(mixture)</text>

  <!-- ── BOX 3: pure feature transfer ── -->
  <rect x="660" y="20" width="280" height="70" rx="8" fill="#E8E8E8" stroke="#BBBBBB" stroke-width="1"/>
  <text x="800" y="44" text-anchor="middle" font-size="12" font-weight="bold" fill="#000">chuyển giao tính năng thuần túy</text>
  <text x="800" y="60" text-anchor="middle" font-size="10" fill="#555">(pure feature transfer)</text>

</svg>
