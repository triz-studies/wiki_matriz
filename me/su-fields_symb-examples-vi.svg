<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 230" font-family="Arial, sans-serif">
  <defs>
    <marker id="aS" markerWidth="9" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <path d="M0,0 L9,3.5 L0,7 Z" fill="#222"/>
    </marker>
    <marker id="aD" markerWidth="9" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <path d="M0,0 L9,3.5 L0,7 Z" fill="#444"/>
    </marker>
  </defs>

  <!-- Bright background -->
  <rect width="1024" height="230" fill="#f0f0f0"/>

  <!--
    4 diagrams evenly spaced across 1024px:
    Centers at: 110, 365, 625, 880
    Each diagram width ~220px
    F at cy=42, S circles at cy=125
    r=26 for all circles
    Arrow from F edge (~y=68) to S edge (~y=99)
  -->

  <!-- ═══════════════════════
       D1: Insufficient
       Cx=110: F@(110,42), S1@(50,125), S2@(170,125)
  ═══════════════════════ -->
  <!-- F -->
  <circle cx="110" cy="42" r="26" fill="#B8DDF5" stroke="#333" stroke-width="1.5"/>
  <text x="110" y="50" text-anchor="middle" font-size="20" font-weight="bold" fill="#111">F</text>
  <!-- S1 -->
  <circle cx="45" cy="125" r="26" fill="#E2E2E2" stroke="#333" stroke-width="1.5"/>
  <text x="41" y="130" text-anchor="middle" font-size="16" font-weight="bold" fill="#111">S</text>
  <text x="55" y="138" font-size="10" fill="#111" font-weight="bold">1</text>
  <!-- S2 -->
  <circle cx="175" cy="125" r="26" fill="#E2E2E2" stroke="#333" stroke-width="1.5"/>
  <text x="171" y="130" text-anchor="middle" font-size="16" font-weight="bold" fill="#111">S</text>
  <text x="185" y="138" font-size="10" fill="#111" font-weight="bold">2</text>
  <!-- F→S1 solid -->
  <line x1="92"  y1="62" x2="62"  y2="102" stroke="#222" stroke-width="1.8" marker-end="url(#aS)"/>
  <!-- F→S2 solid -->
  <line x1="128" y1="62" x2="158" y2="102" stroke="#222" stroke-width="1.8" marker-end="url(#aS)"/>
  <!-- S2→S1 dashed -->
  <line x1="148" y1="125" x2="73"  y2="125" stroke="#444" stroke-width="1.8" stroke-dasharray="6,4" marker-end="url(#aD)"/>
  <!-- Caption -->
  <text x="110" y="171" text-anchor="middle" font-size="11" font-style="italic" fill="#333">tương tác giữa các chất</text>
  <text x="110" y="185" text-anchor="middle" font-size="11" font-style="italic" fill="#333">là không đủ</text>
  <text x="110" y="199" text-anchor="middle" font-size="10" fill="#777">(insufficient interaction)</text>

  <!-- ═══════════════════════
       D2: Harmful
       F@(365,42), S1@(305,125), S2@(425,125)
  ═══════════════════════ -->
  <circle cx="365" cy="42" r="26" fill="#B8DDF5" stroke="#333" stroke-width="1.5"/>
  <text x="365" y="50" text-anchor="middle" font-size="20" font-weight="bold" fill="#111">F</text>
  <circle cx="300" cy="125" r="26" fill="#E2E2E2" stroke="#333" stroke-width="1.5"/>
  <text x="296" y="130" text-anchor="middle" font-size="16" font-weight="bold" fill="#111">S</text>
  <text x="310" y="138" font-size="10" fill="#111" font-weight="bold">1</text>
  <circle cx="430" cy="125" r="26" fill="#E2E2E2" stroke="#333" stroke-width="1.5"/>
  <text x="426" y="130" text-anchor="middle" font-size="16" font-weight="bold" fill="#111">S</text>
  <text x="440" y="138" font-size="10" fill="#111" font-weight="bold">2</text>
  <!-- F→S1 solid -->
  <line x1="347" y1="62" x2="317" y2="102" stroke="#222" stroke-width="1.8" marker-end="url(#aS)"/>
  <!-- F→S2 solid -->
  <line x1="383" y1="62" x2="413" y2="102" stroke="#222" stroke-width="1.8" marker-end="url(#aS)"/>
  <!-- Wavy S2→S1: from x=404 to x=326, y=125 -->
  <path d="M404,125 C398,115 390,115 384,125 C378,135 370,135 364,125 C358,115 350,115 344,125 C338,135 330,135 326,125"
        fill="none" stroke="#222" stroke-width="2.2"/>
  <polygon points="326,120 310,125 326,130" fill="#222"/>
  <!-- Caption -->
  <text x="365" y="171" text-anchor="middle" font-size="11" font-style="italic" fill="#333">tương tác giữa các chất</text>
  <text x="365" y="185" text-anchor="middle" font-size="11" font-style="italic" fill="#333">là có hại</text>
  <text x="365" y="199" text-anchor="middle" font-size="10" fill="#777">(harmful interaction)</text>

  <!-- ═══════════════════════
       D3: Missing field
       No F. S1@(580,125), S2@(700,125), centered at 640
  ═══════════════════════ -->
  <circle cx="580" cy="125" r="26" fill="#E2E2E2" stroke="#333" stroke-width="1.5"/>
  <text x="576" y="130" text-anchor="middle" font-size="16" font-weight="bold" fill="#111">S</text>
  <text x="590" y="138" font-size="10" fill="#111" font-weight="bold">1</text>
  <!-- S2→S1 dashed, from S2 left edge to S1 right edge -->
  <line x1="673" y1="125" x2="608" y2="125" stroke="#444" stroke-width="1.8" stroke-dasharray="6,4" marker-end="url(#aD)"/>
  <circle cx="700" cy="125" r="26" fill="#E2E2E2" stroke="#333" stroke-width="1.5"/>
  <text x="696" y="130" text-anchor="middle" font-size="16" font-weight="bold" fill="#111">S</text>
  <text x="710" y="138" font-size="10" fill="#111" font-weight="bold">2</text>
  <!-- Caption -->
  <text x="640" y="171" text-anchor="middle" font-size="11" font-style="italic" fill="#333">trường thiết lập tương tác</text>
  <text x="640" y="185" text-anchor="middle" font-size="11" font-style="italic" fill="#333">giữa các chất bị thiếu</text>
  <text x="640" y="199" text-anchor="middle" font-size="10" fill="#777">(field missing)</text>

  <!-- ═══════════════════════
       D4: Missing substance
       F@(900,42), S1@(900,125) — vertical only
  ═══════════════════════ -->
  <circle cx="900" cy="42" r="26" fill="#B8DDF5" stroke="#333" stroke-width="1.5"/>
  <text x="900" y="50" text-anchor="middle" font-size="20" font-weight="bold" fill="#111">F</text>
  <circle cx="900" cy="125" r="26" fill="#E2E2E2" stroke="#333" stroke-width="1.5"/>
  <text x="896" y="130" text-anchor="middle" font-size="16" font-weight="bold" fill="#111">S</text>
  <text x="910" y="138" font-size="10" fill="#111" font-weight="bold">1</text>
  <!-- Wavy vertical F→S1: from bottom of F (y=68) to above S1 (y=95) -->
  <path d="M900,68 C891,75 909,82 900,89 C891,93 909,97 900,99"
        fill="none" stroke="#222" stroke-width="2.2"/>
  <!-- Arrowhead pointing DOWN into S1 -->
  <polygon points="895,99 905,99 900,110" fill="#222"/>
  <!-- Caption -->
  <text x="900" y="171" text-anchor="middle" font-size="11" font-style="italic" fill="#333">một chất bị thiếu</text>
  <text x="900" y="185" text-anchor="middle" font-size="11" font-style="italic" fill="#333">(one substance missing)</text>

</svg>
