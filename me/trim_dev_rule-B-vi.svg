<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 132" font-family="Arial, sans-serif">


  <!-- Bright background -->
  <rect width="1024" height="132" fill="#f0f0f0"/>

  <!-- ── BOX 1: crossed "function carrier" ── -->
  <rect x="18" y="14" width="278" height="96" rx="8" fill="#ffffff" stroke="#cccccc" stroke-width="1.5"/>
  <!-- Vietnamese primary -->
  <text x="157" y="52" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">bộ phận mang chức năng</text>
  <text x="157" y="70" text-anchor="middle" font-size="11" fill="#777">(function carrier)</text>
  <!-- Red X crosses -->
  <line x1="22"  y1="18"  x2="292" y2="106" stroke="#DD2222" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="292" y1="18"  x2="22"  y2="106" stroke="#DD2222" stroke-width="3.5" stroke-linecap="round"/>

  <!-- ── GREY "if" ARROW ── -->
  <!-- chevron arrow body -->
  <polygon points="330,42 480,42 480,30 540,62 480,94 480,82 330,82" fill="#888888"/>
  <text x="422" y="68" text-anchor="middle" font-size="16" font-weight="bold" fill="#ffffff">nếu (if)</text>

  <!-- ── BOX 2: function object performs the function itself ── -->
  <rect x="558" y="14" width="330" height="96" rx="8" fill="#ffffff" stroke="#cccccc" stroke-width="1.5"/>
  <text x="723" y="46" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">đối tượng chức năng</text>
  <text x="723" y="62" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">tự thực hiện chức năng</text>
  <text x="723" y="78" text-anchor="middle" font-size="10" fill="#777">(function object performs</text>
  <text x="723" y="91" text-anchor="middle" font-size="10" fill="#777">the function itself)</text>

  <!-- ── BLUE U-SHAPED RETURN ARROW ── -->
  <!-- Arc terminates at x=912,y=98 so arrowhead tip sits at ~x=888 -->
  <path d="M 900,34 C 985,34 985,98 912,98"
        fill="none" stroke="#6AAAD4" stroke-width="13" stroke-linecap="butt"/>
  <!-- Arrowhead: large left-pointing triangle at arc end, tip at x=882 -->
  <polygon points="912,82 882,98 912,114" fill="#6AAAD4"/>

</svg>
